version: 1
component: oberth
purpose: single-node Git-over-SSH CI with Argo Workflow execution and an authenticated HTTPS/MCP control surface

load_order:
  - AGENT-CONTRACT.md
  - docs/architecture.md
  - docs/security.md
  - internal/model/types.go
  - internal/store/schema.go

subsystems:
  maintenance_backup:
    paths: [cmd/oberth-store-backup, internal/store/backup_archive.go, docs/database-backup.md, scripts/qualify_database_backup.sh]
    contract: Source-built Linux maintenance utility exports a read-only verified database/WAL snapshot to authenticated CMS; separate private rehearsal precedes acceptance. The tagged synthetic qualification and retained no-swap sandbox joins are mandatory; no live restore or external witness reset is provided.
  operator_backup_restore:
    paths: [internal/installer/backup.go, internal/installer/backup_archive.go, internal/installer/backup_openbao.go, internal/installer/backup_database.go, internal/installer/restore.go, cmd/oberth/backup.go, docs/backup-restore.md]
    contract: Workstation `oberth backup` seals OpenBao KV/policies/roles, the in-pod verified database snapshot (approvals included), compatibility values and Helm values into one CMS AES-256-GCM archive; `oberth restore` verifies it offline, plans, confirms, writes OpenBao with read-back, swaps the database through a PVC-mounting pod, and never puts tokens or secrets in argv.
  persistence:
    paths: [internal/model, internal/store]
    contract: SQLite is the durable single-writer state for runs, promotions, issues, uplinks, and audit.
  git_ingress:
    paths: [internal/gitcache, internal/sshserver]
    contract: Authenticated smart protocol accepts only branch/tag refs and records actor-bound push events durably.
  execution:
    paths: [pkg/argoworkflow, internal/argojob]
    contract: Each push submits an Argo Workflow from the repository's .oberth/build.yaml or .oberth/release.yaml; the server sets metadata, forces ServiceAccount identity by trigger tier, and injects the source checkout.
  workflow_capabilities:
    paths: [pkg/argoworkflow/capability.go, internal/argojob/capability.go, internal/service/workflow_capability.go, internal/store/workflow_capability_grants.go, docs/workflow-capabilities.md]
    contract: Administrator grants bind a repository to an operator-owned namespaced identity, explicit resource kinds and extended-resource ceilings; repository Workflows own objects, cleanup and test gates.
  control_plane:
    paths: [internal/api, internal/service, internal/app, internal/secretstore, cmd/oberth]
    contract: TLS 1.3 HTTPS/MCP and SSH compose the same durable identity and run state. Secret-store paths are authorized at admission and fetched in credentialed Pods by secretstore exec, never via etcd.
  deployment:
    paths: [charts/oberth, Dockerfile]
    contract: One namespace-scoped Deployment, a digest-pinned server image, one PVC, and a configurable NodePort, LoadBalancer or ClusterIP Service; pipeline Pods run allowlisted images in a separate namespace under trigger-selected ServiceAccounts.

skip_paths:
  - .worktrees
  - bin
  - dist
  - node_modules

cross_component_contracts:
  - AGENT-CONTRACT.md
  - charts/oberth/values.yaml
  - pkg/argoworkflow

verification:
  tier_1:
    - go vet ./...
    - go test -race -count=1 ./...
    - golangci-lint run ./...
  tier_2:
    - make build
    - make helm-lint
  tier_3:
    - fresh-cluster feature/red/green/supersede/promote/tag-release validation

symptom_index:
  push_not_queued: [internal/sshserver, internal/gitcache, internal/store/runs.go]
  job_stuck: [internal/argojob/controller.go, internal/store/runs.go]
  token_rejected: [internal/auth, internal/store/store.go]
  issue_missing: [internal/store/issues.go, internal/api/mcp.go]
  log_slice_wrong: [internal/runlog]
