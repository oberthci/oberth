version: 1
component: oberth
purpose: single-node Git-over-SSH CI with Kubernetes Job execution and an authenticated HTTPS/MCP control surface

load_order:
  - AGENT-CONTRACT.md
  - docs/architecture.md
  - docs/security.md
  - internal/model/types.go
  - internal/store/schema.go

subsystems:
  persistence:
    paths: [internal/model, internal/store]
    contract: SQLite is the durable single-writer state for runs, promotions, issues, uplinks, and audit.
  git_ingress:
    paths: [internal/gitcache, internal/sshserver]
    contract: Authenticated smart protocol accepts only branch/tag refs and records actor-bound push events durably.
  execution:
    paths: [pkg/argoworkflow, internal/argojob]
    contract: Each push submits an Argo Workflow from the repository's .oberth/build.yaml or .oberth/release.yaml; the server sets metadata, forces ServiceAccount identity by trigger tier, and injects the source checkout.
  vm_lifecycle:
    paths: [internal/vmrunner, internal/store/vm_executions.go, internal/store/vm_pilots.go, internal/service/trusted_policy.go, docs/trusted-vm-pilot.md]
    contract: Required-suite policy gates builds and publication; v13 lifecycle and inactive v14 Beacon pilot journals share one capacity authority. Protected result, restart and cleanup contracts do not activate a suite executor.
  control_plane:
    paths: [internal/api, internal/service, internal/app, internal/secretstore, cmd/oberth]
    contract: TLS 1.3 HTTPS/MCP and SSH compose the same durable identity and run state. Secret-store release secrets are fetched server-side at admission and exec-delivered to release Pods, never via etcd.
  deployment:
    paths: [charts/oberth, Dockerfile]
    contract: One namespace-scoped Deployment, a digest-pinned server image, one PVC, and fixed NodePorts; pipeline Pods run allowlisted images in a separate namespace under trigger-selected ServiceAccounts.

skip_paths:
  - .worktrees
  - bin
  - dist

cross_component_contracts:
  - AGENT-CONTRACT.md
  - charts/oberth/values.yaml
  - pkg/argoworkflow

verification:
  tier_1:
    - go vet ./...
    - go test -race -count=1 ./...
    - golangci-lint run ./...
  tier_2:
    - make build
    - make helm-lint
  tier_3:
    - fresh-cluster feature/red/green/supersede/promote/tag-release validation

symptom_index:
  push_not_queued: [internal/sshserver, internal/gitcache, internal/store/runs.go]
  job_stuck: [internal/argojob/controller.go, internal/store/runs.go]
  token_rejected: [internal/auth, internal/store/store.go]
  issue_missing: [internal/store/issues.go, internal/api/mcp.go]
  log_slice_wrong: [internal/runlog]
