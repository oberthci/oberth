# Opt in explicitly on the separate openbao chart 0.28.6 release.
# These names assume Oberth release=oberth, namespace=oberth. Adjust together
# with the rendered PriorityClasses for any other release/namespace.
server:
  # Template changes require an explicit Pod delete; restart seals OpenBao
  # until auto-unseal or an operator unseals it. See the rollout instructions.
  updateStrategyType: OnDelete
  priorityClassName: oberth-oberth-platform-openbao
  resources:
    # Initial sizing from a coordinator-supplied idle sample and margin;
    # UNMEASURED UNDER LOAD. No new CPU/memory limits.
    requests:
      cpu: 100m
      memory: 64Mi
