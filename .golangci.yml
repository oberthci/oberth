version: "2"

run:
  timeout: 10m
  concurrency: 1

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    gosec:
      excludes:
        - G104
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1016
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, bodyclose, rowserrcheck, sqlclosecheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/oberthci
