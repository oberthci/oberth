# Reproducible QEMU runtime image for the trusted KVM harness.
# Single-platform linux/amd64 only. The qemu base package (10.0.0-r1)
# provides bios-256k.bin, linuxboot_dma.bin, and kvmvapic.bin; the
# separate seabios package is not needed.  VGA BIOS is unused (-display
# none).  Pin exact versions; regenerate the lockfile with:
#   apko lock packaging/kvm-harness/runtime.apko.yaml
contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.22/community
  packages:
    - qemu-system-x86_64=10.0.0-r1
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65534
  users:
    - username: nonroot
      uid: 65534
      gid: 65534

archs:
  - x86_64
