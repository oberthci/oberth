suite: per-repository CI secret-store verification
release:
  name: oberth
  namespace: server-system
templates:
  - templates/rbac-argo.yaml
set:
  image.ref: example.invalid/oberth@sha256:1111111111111111111111111111111111111111111111111111111111111111
  argo.namespace: pipeline-system
tests:
  - it: grants only the base identities without configured CI identities
    documentIndex: 0
    asserts:
      - equal:
          path: rules[5].resourceNames
          value: [oberth-argo-credentialed, oberth-argo-executor]
  - it: accepts null CI identities without adding token authority
    set:
      argo.perRepoCIIdentities: null
    documentIndex: 0
    asserts:
      - equal:
          path: rules[5].resourceNames
          value: [oberth-argo-credentialed, oberth-argo-executor]
  - it: combines exact execution and CI identity allowlists in the base role
    set:
      argo.perRepoIdentities: [release-one]
      argo.perRepoCIIdentities: [ci-one, ci-two]
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: pipeline-system
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [serviceaccounts/token]
            resourceNames: [oberth-argo-credentialed, oberth-argo-executor, release-one, ci-one, ci-two]
            verbs: [create]
  - it: binds the base role to the server across namespaces
    set:
      argo.perRepoIdentities: null
      argo.perRepoCIIdentities: [ci-one]
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: pipeline-system
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: oberth
              namespace: server-system
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: oberth-argo
