suite: external store TokenReview identities
release:
  name: oberth
  namespace: server-system
templates:
  - templates/secretstore.yaml
set:
  image.ref: example.invalid/oberth@sha256:1111111111111111111111111111111111111111111111111111111111111111
  argo.namespace: pipeline-system
  argo.perRepoIdentities: [release-one]
  argo.perRepoCIIdentities: [ci-one]
  argo.perStepIdentities: [step-one]
tests:
  - it: leaves local store authority unchanged
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: oberth
              namespace: server-system
  - it: grants external TokenReview only to exact login identities
    set:
      secretstore.address: https://bao.example.com:8200
      argo.credentialedServiceAccount: release-login
      argo.ciSecrets.serviceAccount: ci-login
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: oberth
              namespace: server-system
            - kind: ServiceAccount
              name: release-login
              namespace: pipeline-system
            - kind: ServiceAccount
              name: ci-login
              namespace: pipeline-system
            - kind: ServiceAccount
              name: release-one
              namespace: pipeline-system
            - kind: ServiceAccount
              name: ci-one
              namespace: pipeline-system
            - kind: ServiceAccount
              name: step-one
              namespace: pipeline-system
  - it: detects a separate external pipeline store
    set:
      argo.vault.address: https://pipeline-bao.example.com
    asserts:
      - lengthEqual:
          path: subjects
          count: 6
  - it: supports local stores behind custom DNS
    set:
      secretstore.address: https://bao.example.com
      secretstore.external: false
    asserts:
      - lengthEqual:
          path: subjects
          count: 1
  - it: supports external stores behind cluster-local aliases
    set:
      secretstore.external: true
    asserts:
      - lengthEqual:
          path: subjects
          count: 6
  - it: honors operator managed bindings
    set:
      secretstore.external: true
      secretstore.createAuthDelegatorBinding: false
    asserts:
      - hasDocuments:
          count: 0
