suite: execution target policy
templates:
   - templates/deployment.yaml
tests:
   - it: mounts the administrator target policy and credentials read only
     set:
       argo.executionTargetConfigMap: target-fixture
       argo.executionTargetCredentialsSecret: target-credentials
     asserts:
       - contains:
           path: spec.template.spec.volumes
           content:
             name: execution-target
             configMap:
               name: target-fixture
               optional: false
               items:
                 - key: config.json
                   path: config.json
       - contains:
           path: spec.template.spec.volumes
           content:
             name: execution-target-credentials
             secret:
               secretName: target-credentials
               optional: false
               defaultMode: 0440
       - contains:
           path: spec.template.spec.containers[0].args
           content: --argo-execution-target-config=/etc/oberth/execution-target/config.json
       - contains:
           path: spec.template.spec.containers[0].volumeMounts
           content:
             name: execution-target
             mountPath: /etc/oberth/execution-target
             readOnly: true
       - contains:
           path: spec.template.spec.containers[0].volumeMounts
           content:
             name: execution-target-credentials
             mountPath: /etc/oberth/execution-target-credentials
             readOnly: true
   - it: keeps every run local by default
     asserts:
       - notContains:
           path: spec.template.spec.containers[0].args
           content: --argo-execution-target-config=/etc/oberth/execution-target/config.json
   - it: refuses credentials without a target policy
     set:
       argo.executionTargetCredentialsSecret: orphan
     asserts:
       - failedTemplate:
           errorMessage: argo.executionTargetCredentialsSecret requires argo.executionTargetConfigMap
