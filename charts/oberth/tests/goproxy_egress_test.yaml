suite: Pipeline egress reaches the configured Go proxy
templates:
  - templates/networkpolicy.yaml
release:
  name: custom
  namespace: server-system
set:
  image.ref: example.invalid/oberth@sha256:1111111111111111111111111111111111111111111111111111111111111111
  argo.goProxy.enabled: true
  argo.goProxy.modulePrefix: go.example.test
  argo.goProxy.upstream: forge
  argo.goProxy.organization: example
  argo.namespace: pipeline-system
tests:
  - it: allows the default proxy port only to this release's server pods
    asserts:
      - equal:
          path: metadata.namespace
          value: pipeline-system
      - equal:
          path: spec.policyTypes
          value: [Egress]
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: server-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: oberth
                    app.kubernetes.io/instance: custom
            ports:
              - port: 8444
                protocol: TCP
      - lengthEqual:
          path: spec.egress
          count: 4
  - it: allows the configured proxy port without a general outbound allowance
    set:
      argo.goProxy.port: 9444
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: server-system
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: oberth
                    app.kubernetes.io/instance: custom
            ports:
              - port: 9444
                protocol: TCP
      - lengthEqual:
          path: spec.egress
          count: 4
  - it: preserves namespace-scoped DNS and existing egress when the proxy is disabled
    set:
      argo.goProxy.enabled: false
    asserts:
      - equal:
          path: spec.egress
          value:
            - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
              to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
            - ports:
                - port: 443
                  protocol: TCP
                - port: 6443
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openbao
              ports:
                - port: 8200
                  protocol: TCP
  - it: uses the configured resolver namespace when the proxy is disabled
    set:
      argo.goProxy.enabled: false
      networkPolicy.dnsNamespace: dns-system
    asserts:
      - equal:
          path: spec.egress[0]
          value:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: dns-system
  - it: permits unrestricted DNS destinations only with the explicit opt-out
    set:
      argo.goProxy.enabled: false
      networkPolicy.dnsAnyDestination: true
    asserts:
      - equal:
          path: spec.egress[0]
          value:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
  - it: keeps egress closed for legacy values without a proxy block
    set:
      argo.goProxy: null
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: kube-system
  - it: omits egress isolation when network policies are disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
