suite: executor retry persistence permissions
release:
  name: oberth
  namespace: server-system
templates:
  - templates/rbac-argo.yaml
set:
  image.ref: example.invalid/oberth@sha256:1111111111111111111111111111111111111111111111111111111111111111
  argo.namespace: pipeline-system
tests:
  - it: grants pod patch in the base role
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: pipeline-system
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [create, get, list, watch, delete, patch]
  - it: binds only the server identity in the pipeline namespace
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.namespace
          value: pipeline-system
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: oberth
              namespace: server-system
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: oberth-argo
