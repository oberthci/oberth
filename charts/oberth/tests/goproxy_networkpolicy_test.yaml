suite: Go proxy ingress preserves public listeners
templates:
  - templates/goproxy-networkpolicy.yaml
release:
  name: oberth
  namespace: server-system
set:
  image.ref: example.invalid/oberth@sha256:1111111111111111111111111111111111111111111111111111111111111111
  argo.goProxy.enabled: true
  argo.goProxy.modulePrefix: go.example.test
  argo.goProxy.upstream: forge
  argo.goProxy.organization: example
  argo.namespace: pipeline-system
tests:
  - it: permits public SSH and HTTPS while restricting the proxy to pipeline pods
    asserts:
      - equal:
          path: metadata.namespace
          value: server-system
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: oberth
            app.kubernetes.io/instance: oberth
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: pipeline-system
                  podSelector:
                    matchExpressions:
                      - key: oberth.ci/trigger
                        operator: Exists
              ports:
                - port: 8444
                  protocol: TCP
            - ports:
                - port: ssh
                  protocol: TCP
                - port: https
                  protocol: TCP
  - it: uses pod listener names even with custom public Service ports
    set:
      service.sshPort: 2022
      service.httpsPort: 9443
    asserts:
      - equal:
          path: spec.ingress[1]
          value:
            ports:
              - port: ssh
                protocol: TCP
              - port: https
                protocol: TCP
  - it: restricts a custom proxy port without exposing it to public ingress
    set:
      argo.goProxy.port: 9444
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 9444
              protocol: TCP
      - equal:
          path: spec.ingress[1]
          value:
            ports:
              - port: ssh
                protocol: TCP
              - port: https
                protocol: TCP
  - it: omits ingress isolation when the proxy is disabled
    set:
      argo.goProxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: omits ingress isolation when network policies are disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
