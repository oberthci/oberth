apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "oberth.controlPlanePriorityClass" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Oberth server recovers ahead of pipeline workloads."
