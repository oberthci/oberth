{{- $runtimeCapacity := (.Values.admission).runtimeCapacity | default dict -}}
{{- if $runtimeCapacity.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oberth.fullname" . }}-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
data:
  {{- /* hasKey/kindIs, not coalesce: zero is a meaningful value (no ceiling). */}}
  {{- $jobs := .Values.maxConcurrentJobs }}
  {{- if and (hasKey $runtimeCapacity "maxConcurrentJobs") (not (kindIs "invalid" $runtimeCapacity.maxConcurrentJobs)) }}
  {{- $jobs = $runtimeCapacity.maxConcurrentJobs }}
  {{- end }}
  max-concurrent-jobs: {{ $jobs | toString | quote }}
{{- end }}
