{{- if not .Values.ssh.hostKey.existingSecret }}
{{- $name := include "oberth.hostKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{/*
  Security fix: when the Secret already exists, render nothing.
  helm.sh/resource-policy: keep causes Helm to orphan (preserve) the live
  Secret, so no private key bytes ever enter a rendered manifest or the
  Helm release Secret in etcd. This matches the upstream-secrets.yaml pattern.
*/}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # The host key is the deployment's durable Git and audit-witness identity.
    # Losing it orphans the public Rekor witness chain; keep it across
    # uninstall so a reinstall continues the same identity.
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
type: Opaque
data:
  ssh_host_key: {{ genPrivateKey "ecdsa" | b64enc }}
{{- end }}
{{- end }}
