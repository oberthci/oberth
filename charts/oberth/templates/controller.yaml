{{- define "oberth.controllerData" -}}
instanceID: {{ .Release.Namespace | quote }}
parallelism: {{ .Values.runs.parallel | quote }}
executor: |
  image: {{ (include "oberth.executorImage" .) | quote }}
  imagePullPolicy: {{ .Values.argoNative.images.pullPolicy | quote }}
  env:
    - name: OBERTH_SOURCE_ENDPOINT
      value: {{ .Values.server.runtime.source.endpoint | quote }}
    - name: OBERTH_SOURCE_SERVER_NAME
      value: {{ .Values.server.runtime.source.server_name | quote }}
    - name: OBERTH_SOURCE_CA_PEM
      value: {{ .Values.server.runtime.source.ca_pem | quote }}
  {{- if .Values.policies.floor }}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  {{- end }}
{{- if .Values.policies.floor }}
mainContainer: |
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
{{- end }}
failedPodRestart: |
  enabled: true
  maxRestarts: 1
artifactDrivers: |
  - name: oberth
    image: {{ (include "oberth.sourceImage" .) | quote }}
images: |
  {{ (include "oberth.sourceImage" .) | quote }}:
    entrypoint: [/usr/local/bin/oberth-source-plugin]
{{- if .Values.argoNative.controller.workflowDefaults }}
workflowDefaults: |
  {{- .Values.argoNative.controller.workflowDefaults | toYaml | nindent 2 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.server.runtime.controller_configmap }}
  namespace: {{ include "oberth.argoNamespace" . }}
  annotations:
    oberth.ci/parallel-origin: {{ get (default (dict "parallel runs" "default") .Values.statusOrigins) "parallel runs" | quote }}
data:
  {{- include "oberth.controllerData" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oberth-source
  namespace: {{ .Values.pipeline.namespace }}
data:
  source.json: {{ (deepCopy .Values.server.runtime.source | merge (dict "image_digest" (include "oberth.sourceImage" .))) | toJson | quote }}
