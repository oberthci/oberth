{{- if .Values.argo.releaseTagRoutes }}
{{- range $repo := .Values.archivedRepositories }}
{{- if hasKey $.Values.argo.releaseTagRoutes $repo }}
{{- fail (printf "release tag routes for archived repository %s must be removed" $repo) }}
{{- end }}
{{- end }}
{{- range $repo, $routes := .Values.argo.releaseTagRoutes }}
{{- range $route := $routes }}
{{- if has $route.file (list ".oberth/build.yaml" ".oberth/fragment.yaml" ".oberth/schedule.yaml") }}
{{- fail (printf "release tag route for %s must select a release-only workflow file" $repo) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oberth.fullname" . }}-release-tag-routes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
data:
  routes.json: {{ .Values.argo.releaseTagRoutes | toJson | quote }}
{{- end }}
