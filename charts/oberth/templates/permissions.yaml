apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oberth-server
  namespace: {{ .Values.pipeline.namespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch, patch]
  - apiGroups: [argoproj.io]
    resources: [workflowtemplates]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get, create]
  - apiGroups: [argoproj.io]
    resources: [cronworkflows]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [oberth-source, oberth-sync-limits]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oberth-server
  namespace: {{ .Values.pipeline.namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oberth-server}
subjects:
  - {kind: ServiceAccount, name: oberth, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oberth-controller-reader
  namespace: {{ include "oberth.argoNamespace" . }}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [{{ .Values.server.runtime.controller_configmap }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oberth-controller-reader
  namespace: {{ include "oberth.argoNamespace" . }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oberth-controller-reader}
subjects:
  - {kind: ServiceAccount, name: oberth, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oberth.clusterName" (list . "source-review") }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oberth.clusterName" (list . "source-review") }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "oberth.clusterName" (list . "source-review") }}}
subjects:
  - {kind: ServiceAccount, name: oberth, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oberth-task-results
  namespace: {{ .Values.pipeline.namespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oberth-task-results
  namespace: {{ .Values.pipeline.namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oberth-task-results}
subjects:
  - {kind: Group, apiGroup: rbac.authorization.k8s.io, name: 'system:serviceaccounts:{{ .Values.pipeline.namespace }}'}
