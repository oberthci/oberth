{{- if not .Values.secretstore.enabled }}
{{- fail "OpenBao is required for server and upstream identities; configure secretstore.enabled" }}
{{- end }}
{{- if or .Values.tls.existingSecret .Values.ssh.hostKey.existingSecret .Values.auditAnchor.rootsSecret }}
{{- fail "Kubernetes Secrets are not supported; migrate private identities to OpenBao and public trust anchors to ConfigMaps" }}
{{- end }}
{{- /* External audit anchoring is opt-in: dependent knobs without their URL
would render a pod the server refuses to start, so fail at template time. */}}
{{- if and (not .Values.auditAnchor.tsaURL) .Values.auditAnchor.tsaCA }}
{{- fail "auditAnchor.tsaCA requires auditAnchor.tsaURL" }}
{{- end }}
{{- if and (not .Values.auditAnchor.rekorURL) .Values.auditAnchor.rekorCA }}
{{- fail "auditAnchor.rekorCA requires auditAnchor.rekorURL" }}
{{- end }}
{{- if and (not .Values.auditAnchor.rekorURL) .Values.auditAnchor.rekorPublicKey }}
{{- fail "auditAnchor.rekorPublicKey requires auditAnchor.rekorURL" }}
{{- end }}
{{- if and (not .Values.auditAnchor.tsaURL) .Values.auditAnchor.tsaInsecureHTTP }}
{{- fail "auditAnchor.tsaInsecureHTTP requires auditAnchor.tsaURL" }}
{{- end }}
{{- if and (not .Values.auditAnchor.rekorURL) .Values.auditAnchor.rekorInsecureHTTP }}
{{- fail "auditAnchor.rekorInsecureHTTP requires auditAnchor.rekorURL" }}
{{- end }}
{{- if and (not .Values.auditAnchor.rekorURL) .Values.auditAnchor.acceptWitnessChainReset }}
{{- fail "auditAnchor.acceptWitnessChainReset requires auditAnchor.rekorURL (the external Rekor witness)" }}
{{- end }}
{{- if and (not .Values.auditAnchor.rekorURL) .Values.auditAnchor.acceptWitnessGenesis }}
{{- fail "auditAnchor.acceptWitnessGenesis requires auditAnchor.rekorURL (the external Rekor witness)" }}
{{- end }}
{{- if and .Values.auditAnchor.acceptWitnessGenesis .Values.auditAnchor.acceptWitnessChainReset }}
{{- fail "auditAnchor.acceptWitnessGenesis and auditAnchor.acceptWitnessChainReset are mutually exclusive" }}
{{- end }}
{{- $compatibility := .Values.compatibility | default dict -}}
{{- $schemaIdentity := required "compatibility.schemaIdentity must preserve the existing database identity on upgrade" $compatibility.schemaIdentity -}}
{{- $auditDomain := required "compatibility.auditDomain must preserve the existing audit-chain domain on upgrade" $compatibility.auditDomain -}}
{{- $witnessKeyInfo := required "compatibility.witnessKeyInfo must preserve the existing witness identity on upgrade" $compatibility.witnessKeyInfo -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oberth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "oberth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oberth.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.argo.releaseTagRoutes }}
        checksum/release-tag-routes: {{ .Values.argo.releaseTagRoutes | toJson | sha256sum | quote }}
        {{- end }}
        {{- if .Values.argo.releaseWIF }}
        checksum/release-wif: {{ .Values.argo.releaseWIF | toJson | sha256sum | quote }}
        {{- end }}
        checksum/per-repo-identities: {{ list .Values.argo.perRepoIdentities .Values.argo.perRepoCIIdentities | toJson | sha256sum | quote }}
        # Audit clients load TLS roots at startup; rotate the Pod with the bundle.
        {{- if .Values.auditAnchor.rekorCA }}
        checksum/audit-rekor-ca: {{ .Values.auditAnchor.rekorCA | sha256sum | quote }}
        {{- end }}
        {{- if .Values.auditAnchor.tsaCA }}
        checksum/audit-tsa-ca: {{ .Values.auditAnchor.tsaCA | sha256sum | quote }}
        {{- end }}
        {{- if .Values.auditAnchor.rekorPublicKey }}
        checksum/audit-rekor-pubkey: {{ .Values.auditAnchor.rekorPublicKey | sha256sum | quote }}
        {{- end }}
        {{- if and .Values.secretstore.enabled .Values.secretstore.caCert }}
        checksum/secretstore-ca: {{ .Values.secretstore.caCert | sha256sum | quote }}
        {{- end }}
        {{- if and .Values.argo.vault.address .Values.argo.vault.caCert }}
        # The server reads this anchor once, at startup, and hands the bytes to
        # every release run: a rotation that did not restart the pod would keep
        # delivering the retired certificate until something else happened to.
        checksum/argo-vault-ca: {{ .Values.argo.vault.caCert | sha256sum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      priorityClassName: {{ include "oberth.controlPlanePriorityClass" . }}
      serviceAccountName: {{ include "oberth.serviceAccountName" . }}
      automountServiceAccountToken: true
      # SIGTERM drains HTTP/MCP (15s), lets scheduler observers finalize
      # (30s) and then stops API background work (10s). The default leaves
      # margin over that 55s worst case; --reuse-values drops new defaults.
      terminationGracePeriodSeconds: {{ int64 (.Values.terminationGracePeriodSeconds | default 75) }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath volumes receive no fsGroup ownership management from the
        # kubelet. This container replaces the former manual prepare-node.sh
        # step: it creates the isolated cache roots and hands them to the
        # unprivileged service and runner user before anything else starts.
        - name: prepare-caches
          image: {{ include "oberth.utilityImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "for dir; do if [ -L \"$dir\" ]; then echo \"prepare-caches: refusing symlink at $dir\" >&2; exit 1; fi; if [ -e \"$dir\" ] && ! [ -d \"$dir\" ]; then echo \"prepare-caches: $dir exists and is not a directory\" >&2; exit 1; fi; done; exec install -d -m 0750 -o 65534 -g 65534 \"$@\"", "prepare-caches"]
          args:
            - {{ .Values.cache.ciRoot | quote }}
            - {{ .Values.cache.releaseRoot | quote }}
            - /run/oberth-identities
            - /run/oberth
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: admin-run
              mountPath: /run/oberth
            - name: identities
              mountPath: /run/oberth-identities
            - name: ci-cache
              mountPath: {{ .Values.cache.ciRoot }}
            - name: release-cache
              mountPath: {{ .Values.cache.releaseRoot }}
      containers:
        - name: oberth
          image: {{ .Values.image.ref | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/oberth"]
          args:
            - serve
            - --data=/data
            - {{ printf "--source-allowlist=%s" (toJson .Values.sourceAccess) | quote }}
            - --database=/data/oberth.sqlite
            - --ssh-listen=:2222
            - --https-listen=:8443
            - --tls-cert=/run/oberth-identities/server/tls.crt
            - --tls-key=/run/oberth-identities/server/tls.key
            - --ssh-host-key=/run/oberth-identities/server/ssh_host_key
            - --upstream-key=/run/oberth-identities/upstream/{{ .Values.upstream.keyFile }}
            - --known-hosts=/run/oberth-identities/hosts/{{ .Values.upstream.knownHostsKey }}
            {{- $statusProbes := .Values.statusProbes | default dict }}
            - --status-upstream-probe-interval={{ $statusProbes.upstreamIntervalSeconds | default 60 }}s
            - --status-cluster-probe-interval={{ $statusProbes.clusterIntervalSeconds | default 60 }}s
            - --status-secretstore-probe-interval={{ $statusProbes.secretStoreIntervalSeconds | default 60 }}s
            - --status-upstream-failure-threshold={{ $statusProbes.upstreamFailureThreshold | default 3 }}
            - --namespace={{ .Release.Namespace }}
            {{- $uplinkTokens := .Values.uplinkTokens | default dict }}
            - "--uplink-token-default-ttl={{ $uplinkTokens.defaultTTL | default "2160h" }}"
            - "--uplink-token-max-ttl={{ $uplinkTokens.maxTTL | default "8760h" }}"
            {{- /*
            Quoted because the default prefix ends in a colon ("golang:"), and
            an unquoted YAML scalar ending in ':' parses as a mapping key --
            the whole arg became {"--runner-image-prefixes=golang": null}, so
            the Deployment could not be applied with the chart's own defaults.
            */}}
            - "--runner-image-prefixes={{ join "," .Values.runnerImagePrefixes }}"
            {{- $kubernetesClient := .Values.kubernetesClient | default dict }}
            - --kubernetes-client-qps={{ $kubernetesClient.qps | default 50 }}
            - --kubernetes-client-burst={{ int64 ($kubernetesClient.burst | default 100) }}
            {{- $retention := .Values.retention | default dict }}
            {{- $logRetention := $retention.logs | default dict }}
            {{- $artifactRetention := $retention.artifacts | default dict }}
            {{- $artifactBudget := int64 4294967296 }}
            {{- if hasKey $artifactRetention "budgetBytes" }}
            {{- $artifactBudget = int64 $artifactRetention.budgetBytes }}
            {{- end }}
            {{- $artifactLimit := int64 268435456 }}
            {{- if hasKey $artifactRetention "limitBytes" }}
            {{- $artifactLimit = int64 $artifactRetention.limitBytes }}
            {{- end }}
            {{- $keepNewest := 1 }}
            {{- if hasKey $retention "keepNewestPerRef" }}
            {{- $keepNewest = int $retention.keepNewestPerRef }}
            {{- end }}
            - {{ printf "--log-retention=%s" ($logRetention.maxAge | default "0s") | quote }}
            - {{ printf "--artifact-retention=%s" ($artifactRetention.maxAge | default "0s") | quote }}
            - --run-log-limit-bytes={{ int64 ($logRetention.limitBytes | default 67108864) }}
            - --logs-budget-bytes={{ int64 ($logRetention.budgetBytes | default 0) }}
            - --artifacts-limit-bytes={{ $artifactLimit }}
            - --artifacts-budget-bytes={{ $artifactBudget }}
            - {{ printf "--retention-sweep-interval=%s" ($retention.interval | default "10m") | quote }}
            - --retention-keep-newest={{ $keepNewest }}
            {{- /* Agent-assisted continuation: every knob is a flag with the binary default, so --reuse-values upgrades keep behaviour. */}}
            {{- $assist := .Values.assist | default dict }}
            {{- $assistEnabled := false }}
            {{- if hasKey $assist "enabled" }}{{- $assistEnabled = $assist.enabled }}{{- end }}
            {{- $assistHolds := int64 2 }}
            {{- if hasKey $assist "maxConcurrentHolds" }}{{- $assistHolds = int64 $assist.maxConcurrentHolds }}{{- end }}
            {{- $assistOutput := int64 65536 }}
            {{- if hasKey $assist "execOutputBytes" }}{{- $assistOutput = int64 $assist.execOutputBytes }}{{- end }}
            {{- $assistPatchBytes := int64 1048576 }}
            {{- if hasKey $assist "patchMaxBytes" }}{{- $assistPatchBytes = int64 $assist.patchMaxBytes }}{{- end }}
            {{- $assistPatchFiles := int64 64 }}
            {{- if hasKey $assist "patchMaxFiles" }}{{- $assistPatchFiles = int64 $assist.patchMaxFiles }}{{- end }}
            - --assist-enabled={{ $assistEnabled }}
            - {{ printf "--assist-hold-ttl=%s" ($assist.holdTTL | default "20m") | quote }}
            - --assist-max-concurrent-holds={{ $assistHolds }}
            - {{ printf "--assist-exec-timeout=%s" ($assist.execTimeout | default "1m") | quote }}
            - --assist-exec-output-bytes={{ $assistOutput }}
            - --assist-patch-max-bytes={{ $assistPatchBytes }}
            - --assist-patch-max-files={{ $assistPatchFiles }}
            {{- $assistScratch := int64 8589934592 }}
            {{- if hasKey $assist "scratchBytes" }}{{- $assistScratch = int64 $assist.scratchBytes }}{{- end }}
            - --assist-scratch-bytes={{ $assistScratch }}
            {{- /* MCP agent loop (#1514): every knob is a flag with the binary default. */}}
            {{- $events := .Values.agentEvents | default dict }}
            {{- $eventsRetention := int64 10000 }}
            {{- if hasKey $events "retention" }}{{- $eventsRetention = int64 $events.retention }}{{- end }}
            {{- $eventsSync := int64 20000 }}
            {{- if hasKey $events "syncRetention" }}{{- $eventsSync = int64 $events.syncRetention }}{{- end }}
            {{- $eventsStreams := int64 4 }}
            {{- if hasKey $events "maxStreamsPerToken" }}{{- $eventsStreams = int64 $events.maxStreamsPerToken }}{{- end }}
            {{- $eventsBacklog := int64 500 }}
            {{- if hasKey $events "maxBacklog" }}{{- $eventsBacklog = int64 $events.maxBacklog }}{{- end }}
            - --agent-events-retention={{ $eventsRetention }}
            - --agent-events-sync-retention={{ $eventsSync }}
            - {{ printf "--agent-events-interval=%s" ($events.interval | default "10s") | quote }}
            - {{ printf "--agent-events-lock-wait-threshold=%s" ($events.lockWaitThreshold | default "60s") | quote }}
            - --agent-events-max-streams-per-token={{ $eventsStreams }}
            - --agent-events-max-backlog={{ $eventsBacklog }}
            - {{ printf "--agent-events-heartbeat=%s" ($events.heartbeat | default "20s") | quote }}
            {{- $schedules := .Values.schedules | default dict }}
            {{- $scheduleMaxEntries := 8 }}
            {{- if hasKey $schedules "maxEntries" }}{{- $scheduleMaxEntries = int $schedules.maxEntries }}{{- end }}
            - {{ printf "--schedule-min-interval=%s" ($schedules.minInterval | default "15m") | quote }}
            - --schedule-max-entries={{ $scheduleMaxEntries }}
            - --ci-cache-root={{ .Values.cache.ciRoot }}
            - --release-cache-root={{ .Values.cache.releaseRoot }}
            {{- if .Values.pushBannerURL }}
            - --push-banner-url={{ .Values.pushBannerURL }}
            {{- end }}
            {{- if .Values.auditAnchor.tsaURL }}
            - --audit-tsa-url={{ .Values.auditAnchor.tsaURL }}
            {{- if .Values.auditAnchor.tsaInsecureHTTP }}
            - --audit-tsa-insecure-http
            {{- end }}
            {{- end }}
            {{- if .Values.auditAnchor.rekorURL }}
            - --audit-rekor-url={{ .Values.auditAnchor.rekorURL }}
            {{- if .Values.auditAnchor.rekorInsecureHTTP }}
            - --audit-rekor-insecure-http
            {{- end }}
            {{- end }}
            - --audit-anchor-interval={{ .Values.auditAnchor.interval }}
            - --audit-anchor-max-age={{ .Values.auditAnchor.maxAge }}
            - --audit-gate-timeout={{ .Values.auditAnchor.gateTimeout | default "2m" }}
            - --audit-gate-verify-timeout={{ .Values.auditAnchor.verifyTimeout | default "45s" }}
            {{- if .Values.auditAnchor.rekorCA }}
            - --audit-rekor-ca=/etc/oberth/audit-rekor-ca/ca.crt
            {{- end }}
            {{- if .Values.auditAnchor.rekorPublicKey }}
            - --audit-rekor-pubkey=/etc/oberth/audit-rekor-pubkey/rekor.pub
            {{- end }}
            {{- if .Values.auditAnchor.tsaCA }}
            - --audit-tsa-ca=/etc/oberth/audit-tsa-ca/ca.crt
            {{- end }}
            {{- if .Values.auditAnchor.acceptWitnessChainReset }}
            - --accept-witness-chain-reset={{ .Values.auditAnchor.acceptWitnessChainReset }}
            {{- end }}
            {{- if .Values.auditAnchor.acceptWitnessGenesis }}
            - --accept-witness-genesis={{ .Values.auditAnchor.acceptWitnessGenesis }}
            {{- end }}
            {{- if .Values.secretstore.enabled }}
            - --secretstore-address={{ .Values.secretstore.address }}
            - --secretstore-k8s-auth-mount={{ .Values.secretstore.k8sAuthMount }}
            - --secretstore-role={{ required "secretstore.role is required when secretstore.enabled is true" .Values.secretstore.role }}
            {{- if .Values.secretstore.caCert }}
            - --secretstore-ca-cert=/etc/oberth/secretstore-ca/ca.crt
            {{- end }}
            {{- if .Values.secretstore.insecureHTTPForDev }}
            - --secretstore-insecure-http
            {{- end }}
            {{- if .Values.secretstore.kvMount }}
            - --secretstore-kv-mount={{ .Values.secretstore.kvMount }}
            {{- end }}
            {{- range .Values.secretstore.allowedPaths }}
            - --secretstore-path={{ . }}
            {{- end }}
            {{- end }}
            - --pipeline-network-policy-enabled={{ .Values.networkPolicy.enabled }}
            - --argo-namespace={{ required "argo.namespace is required" .Values.argo.namespace }}
            {{- if .Values.argo.releaseTagRoutes }}
            - --argo-release-tag-routes-config=/etc/oberth/release-tag-routes/routes.json
            {{- end }}
            {{- if .Values.argo.releaseWIF }}
            - --argo-release-wif-config=/etc/oberth/release-wif/capabilities.json
            {{- end }}
            - --argo-pipeline-serviceaccount={{ .Values.argo.pipelineServiceAccount | default "oberth-argo-pipeline" }}
            - --argo-credentialed-serviceaccount={{ .Values.argo.credentialedServiceAccount | default "oberth-argo-credentialed" }}
            - --argo-ci-secrets-serviceaccount={{ (.Values.argo.ciSecrets).serviceAccount | default "oberth-argo-ci-secrets" }}
            - --argo-executor-serviceaccount={{ .Values.argo.executorServiceAccount }}
            {{- if .Values.argo.sourceStorageClass }}
            - --argo-source-storage-class={{ .Values.argo.sourceStorageClass }}
            {{- end }}
            {{- if .Values.argo.vault.address }}
            - --argo-vault-address={{ .Values.argo.vault.address }}
            - --argo-vault-credentialed-role={{ .Values.argo.vault.credentialedRole | required "argo.vault.credentialedRole is required when argo.vault.address is set" }}
            {{- /* Defaulted inline (not only in values.yaml) so a
                 --reuse-values upgrade from a pre-split revision still names
                 the branch-tier role; without it, CI pipelines with approved
                 upstream secrets are refused at admission (fail closed). */}}
            - --argo-vault-ci-secrets-role={{ (.Values.argo.ciSecrets).vaultRole | default "oberth-argo-ci-secrets" }}
            {{- if .Values.argo.vault.caCert }}
            - --argo-vault-ca-cert=/etc/oberth/argo-vault-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- $promotion := .Values.promotion | default dict -}}
            {{- $grantMaxLifetime := $promotion.grantMaxLifetime | default "24h" -}}
            {{- if $grantMaxLifetime }}
            - --promotion-grant-max-lifetime={{ $grantMaxLifetime }}
            {{- end }}
            {{- $branches := .Values.branches | default dict -}}
            {{- if and (hasKey $branches "reserved") (kindIs "slice" $branches.reserved) }}
            - {{ printf "--reserved-branches=%s" (join "," $branches.reserved) | quote }}
            {{- end }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.secretstore.address | quote }}
            - name: VAULT_CACERT
              value: {{ ternary "/etc/oberth/secretstore-ca/ca.crt" "" (not (empty .Values.secretstore.caCert)) | quote }}
            - name: OBERTH_VAULT_AUTH_MOUNT
              value: {{ .Values.secretstore.k8sAuthMount | quote }}
            - name: OBERTH_VAULT_INSECURE_DEV_HTTP
              value: {{ .Values.secretstore.insecureHTTPForDev | quote }}
            - name: OBERTH_VAULT_ROLE
              value: {{ .Values.secretstore.role | quote }}
            - name: OBERTH_TLS_NAMES
              value: {{ concat (.Values.tls.extraDNSNames | default list) (.Values.tls.extraIPs | default list) | join "," | quote }}
            {{- with (.Values.tls.pki | default dict) }}
            {{- if .enabled }}
            - name: OBERTH_SERVER_PKI_MOUNT
              value: {{ .mount | default "oberth-pki" | quote }}
            - name: OBERTH_SERVER_PKI_ROLE
              value: {{ .role | default "oberth-server" | quote }}
            - name: OBERTH_SERVER_PKI_TTL
              value: {{ .ttl | default "" | quote }}
            {{- end }}
            {{- end }}
            - name: OBERTH_SCHEMA_IDENTITY
              value: {{ $schemaIdentity | quote }}
            - name: OBERTH_AUDIT_DOMAIN
              value: {{ $auditDomain | quote }}
            - name: OBERTH_WITNESS_KEY_INFO
              value: {{ $witnessKeyInfo | quote }}
            - name: SIGSTORE_NO_CACHE
              value: "true"
          ports:
            - name: ssh
              containerPort: 2222
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
            initialDelaySeconds: 2
            # Include TLS handshake and CPU scheduling under CI load. The
            # dependency snapshot itself remains off the HTTP request path.
            timeoutSeconds: 5
            periodSeconds: 5
            # Tolerate TLS/scheduling delays for about 30s under CPU load.
            failureThreshold: 6
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /livez
              port: https
            timeoutSeconds: 15
            # Five minutes without local progress, then three failures a minute
            # apart, tolerates sustained CI load before restarting the process.
            periodSeconds: 60
            failureThreshold: 3
          resources:
            {{- $resources := deepCopy .Values.resources }}
            {{- if not $resources.limits.cpu }}
            {{- $_ := unset $resources.limits "cpu" }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ci-cache
              mountPath: {{ .Values.cache.ciRoot }}
            - name: release-cache
              mountPath: {{ .Values.cache.releaseRoot }}
            - name: identities
              mountPath: /run/oberth-identities
            {{- if .Values.auditAnchor.rekorCA }}
            - name: audit-rekor-ca
              mountPath: /etc/oberth/audit-rekor-ca
              readOnly: true
            {{- end }}
            {{- if .Values.auditAnchor.rekorPublicKey }}
            - name: audit-rekor-pubkey
              mountPath: /etc/oberth/audit-rekor-pubkey
              readOnly: true
            {{- end }}
            {{- if .Values.auditAnchor.tsaCA }}
            - name: audit-tsa-ca
              mountPath: /etc/oberth/audit-tsa-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.secretstore.enabled .Values.secretstore.caCert }}
            - name: secretstore-ca
              mountPath: /etc/oberth/secretstore-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.argo.vault.address .Values.argo.vault.caCert }}
            - name: argo-vault-ca
              mountPath: /etc/oberth/argo-vault-ca
              readOnly: true
            {{- end }}
            - name: admin-run
              mountPath: /run/oberth
            - name: tmp
              mountPath: /tmp
            {{- if .Values.argo.releaseTagRoutes }}
            - name: release-tag-routes
              mountPath: /etc/oberth/release-tag-routes
              readOnly: true
            {{- end }}
            {{- if .Values.argo.releaseWIF }}
            - name: release-wif
              mountPath: /etc/oberth/release-wif
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.argo.releaseTagRoutes }}
        - name: release-tag-routes
          configMap:
            name: {{ include "oberth.fullname" . }}-release-tag-routes
        {{- end }}
        {{- if .Values.argo.releaseWIF }}
        - name: release-wif
          configMap:
            name: {{ include "oberth.fullname" . }}-release-wif
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "oberth.pvcName" . }}
        - name: ci-cache
          hostPath:
            path: {{ .Values.cache.ciRoot }}
            type: DirectoryOrCreate
        - name: release-cache
          hostPath:
            path: {{ .Values.cache.releaseRoot }}
            type: DirectoryOrCreate
        - name: identities
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if .Values.auditAnchor.rekorCA }}
        - name: audit-rekor-ca
          configMap:
            name: {{ include "oberth.fullname" . }}-audit-rekor-ca
        {{- end }}
        {{- if .Values.auditAnchor.rekorPublicKey }}
        - name: audit-rekor-pubkey
          configMap:
            name: {{ include "oberth.fullname" . }}-audit-rekor-pubkey
        {{- end }}
        {{- if .Values.auditAnchor.tsaCA }}
        - name: audit-tsa-ca
          configMap:
            name: {{ include "oberth.fullname" . }}-audit-tsa-ca
        {{- end }}
        {{- if and .Values.secretstore.enabled .Values.secretstore.caCert }}
        - name: secretstore-ca
          configMap:
            name: {{ include "oberth.fullname" . }}-secretstore-ca
        {{- end }}
