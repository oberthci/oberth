{{- $wif := .Values.argo.releaseWIF | default dict }}
{{- range $repo := .Values.archivedRepositories }}
{{- if hasKey (get $wif "repositories" | default dict) $repo }}
{{- fail (printf "releaseWIF entry for archived repository %s must be removed" $repo) }}
{{- end }}
{{- end }}
{{- if .Values.argo.releaseWIF }}
{{- if ne .Values.argo.releaseWIF.namespace .Values.argo.namespace }}
{{- fail "argo.releaseWIF.namespace must exactly match argo.namespace" }}
{{- end }}
# Public capability configuration only. JWTs are issued by the kubelet and
# never appear in this ConfigMap, Helm values, or a Kubernetes Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oberth.fullname" . }}-release-wif
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
data:
  capabilities.json: {{ .Values.argo.releaseWIF | toJson | quote }}
{{- end }}
{{- /* Dedicated WIF-only accounts: no Vault policy/role and no RBAC grants. */}}
{{- $used := dict }}
{{- range $name := list (.Values.argo.pipelineServiceAccount | default "oberth-argo-pipeline") (.Values.argo.credentialedServiceAccount | default "oberth-argo-credentialed") ((.Values.argo.ciSecrets | default dict).serviceAccount | default "oberth-argo-ci-secrets") (.Values.argo.executorServiceAccount | default "oberth-argo-executor") (.Values.argo.vmLauncherServiceAccount | default "oberth-argo-vm-launcher") }}
{{- $_ := set $used $name true }}
{{- end }}
{{- range $repo, $grant := (get $wif "repositories" | default dict) }}
{{- if $grant.service_account_name }}
{{- $_ := set $used $grant.service_account_name true }}
{{- end }}
{{- range $template, $role := $grant.templates }}
{{- if not (hasKey ($wif.roles | default dict) $role) }}
{{- fail (printf "release WIF role %s for %s/%s is not configured" $role $repo $template) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $repo, $grant := (get $wif "repositories" | default dict) }}
{{- range $template, $account := ($grant.step_service_accounts | default dict) }}
{{- if or (hasKey $used $account) (has $account ($.Values.argo.perRepoIdentities | default list)) (has $account ($.Values.argo.perRepoCIIdentities | default list)) (has $account ($.Values.argo.perStepIdentities | default list)) }}
{{- fail (printf "release WIF step %s/%s must use a distinct dedicated ServiceAccount" $repo $template) }}
{{- end }}
{{- if not (hasKey $grant.templates $template) }}
{{- fail (printf "release WIF step %s/%s must have an explicit role mapping" $repo $template) }}
{{- end }}
{{- $route := get ($grant.step_routes | default dict) $template | default dict }}
{{- $matched := false }}
{{- range $configured := (get ($.Values.argo.releaseTagRoutes | default dict) $repo | default list) }}
{{- if and (eq ($route.file | default "") $configured.file) (eq ($route.pattern | default "") $configured.pattern) }}
{{- $matched = true }}
{{- end }}
{{- end }}
{{- if not $matched }}
{{- fail (printf "release WIF step %s/%s must bind an existing exact release tag route" $repo $template) }}
{{- end }}
{{- $_ := set $used $account true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $.Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" $ | nindent 4 }}
    oberth.ci/identity-type: release-wif-step
automountServiceAccountToken: false
{{- end }}
{{- end }}
