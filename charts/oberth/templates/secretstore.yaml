{{- if .Values.secretstore.enabled }}
{{- if .Values.secretstore.caCert }}
# The OpenBao TLS trust anchor is public material; a ConfigMap keeps the
# zero-Kubernetes-Secrets posture for everything secret-store-related.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oberth.fullname" . }}-secretstore-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.secretstore.caCert | nindent 4 }}
{{- end }}
{{- if .Values.secretstore.createAuthDelegatorBinding }}
---
# OpenBao's Kubernetes auth validates login JWTs through TokenReview. Binding
# system:auth-delegator to the Oberth ServiceAccount lets OpenBao use the login
# token itself for that review, so no long-lived reviewer JWT is ever stored in
# OpenBao. Cluster-scoped objects are gated independently:
# secretstore.createAuthDelegatorBinding creates this binding;
# argo.resourceSampler.enabled creates the node metrics ClusterRole/binding;
# platformProtection.enabled creates three platform PriorityClasses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-auth-delegator
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "oberth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- /* Kubernetes service DNS identifies local stores; custom DNS can override. */}}
{{- $address := .Values.argo.vault.address | default .Values.secretstore.address }}
{{- $host := (urlParse $address).hostname | default "" | lower | trimSuffix "." }}
{{- $external := not (regexMatch "\\.svc(\\.cluster\\.local)?$" $host) }}
{{- if ne .Values.secretstore.external nil }}
{{- $external = .Values.secretstore.external }}
{{- end }}
{{- if $external }}
  - kind: ServiceAccount
    name: {{ .Values.argo.credentialedServiceAccount | default "oberth-argo-credentialed" }}
    namespace: {{ .Values.argo.namespace }}
  - kind: ServiceAccount
    name: {{ (.Values.argo.ciSecrets).serviceAccount | default "oberth-argo-ci-secrets" }}
    namespace: {{ .Values.argo.namespace }}
{{- range concat (.Values.argo.perRepoIdentities | default list) (.Values.argo.perRepoCIIdentities | default list) (.Values.argo.perStepIdentities | default list) | uniq }}
  - kind: ServiceAccount
    name: {{ . | quote }}
    namespace: {{ $.Values.argo.namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
