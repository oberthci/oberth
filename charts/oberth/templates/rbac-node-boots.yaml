# Boot IDs are read only for nodes hosting owned step Pods. No node proxy,
# collection, write or kubelet API permission accompanies this observation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-node-boots
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-node-boots
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oberth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-node-boots
