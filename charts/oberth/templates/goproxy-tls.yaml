{{- $goProxy := .Values.argo.goProxy | default dict -}}
{{- if $goProxy.enabled }}
{{- $name := printf "%s-goproxy-tls" (include "oberth.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $ca := genCA "oberth-goproxy-ca" 3650 }}
  {{- $svcName := printf "%s-goproxy" (include "oberth.fullname" .) }}
  {{- $dns := list $svcName (printf "%s.%s" $svcName .Release.Namespace) (printf "%s.%s.svc" $svcName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svcName .Release.Namespace) }}
  {{- $cert := genSignedCert $svcName nil $dns 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
