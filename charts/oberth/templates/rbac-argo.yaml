# Pipeline execution permissions are held in one Role bound to the server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oberth.fullname" . }}-argo
  namespace: {{ required "argo.namespace is required" .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # A Pod may only mount PersistentVolumeClaims in its own namespace, so the
  # checkout on the server's volume cannot be handed to a pipeline that runs
  # here. The server instead creates a claim per run and fills it through a
  # short-lived Pod over the exec stream. Pipeline secrets use
  # projected identity tokens and secretstore exec.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "update", "delete"]
  # Pod patch persists executor-identity retry across observer/server restarts
  # and binds surviving source seeds to their Workflow UID.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # TokenRequests name only installer-provisioned execution identities.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames:
      - {{ .Values.argo.credentialedServiceAccount | default "oberth-argo-credentialed" | quote }}
      - {{ .Values.argo.executorServiceAccount | quote }}
      {{- range .Values.argo.perRepoIdentities }}
      - {{ . | quote }}
      {{- end }}
      {{- range .Values.argo.perRepoCIIdentities }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kube-root-ca.crt"]
    verbs: ["get"]
  # argojob verifies that a credentialed run's per-repo ServiceAccount exists
  # before creating the Job (fail-closed materialization guard, issues
  # #433/#459: a grant added before the installer resync would otherwise
  # produce a Job that binds a non-existent identity). Read-only get; no
  # resourceNames pin is possible because per-repo names carry a dynamic
  # hash suffix. Without this rule every credentialed CI and release run
  # fails closed at Job creation with a Forbidden error (issue #467).
  # Release declaration preflight also uses this read-only check (#1139).
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oberth.fullname" . }}-argo
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oberth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oberth.fullname" . }}-argo
