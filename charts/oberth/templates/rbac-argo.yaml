# The Argo execution engine runs pipelines in their OWN namespace, separate
# from the server's, so the Vault Kubernetes-auth roles bind identities that do
# not sit beside server-tier ones. That means a second, namespaced Role: the
# server creates and supervises Workflows there, and reads the step Pods' logs.
#
# Note what is absent. No create on secrets, no exec, no configmaps: on this
# tier Oberth never holds a credential, because envconsul fetches in-Pod. The
# server's power over an Argo pipeline is exactly the power to submit it, watch
# it, read its logs, and delete it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oberth.fullname" . }}-argo
  namespace: {{ required "argo.namespace is required" .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # A Pod may only mount PersistentVolumeClaims in its own namespace, so the
  # checkout on the server's volume cannot be handed to a pipeline that runs
  # here. The server instead creates a claim per run and fills it through a
  # short-lived Pod over the exec stream — the same transport release secrets
  # travel on, and the only one that needs no credential in this namespace.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # secretstore verify --release-tier requests a short-lived token for the
  # release ServiceAccount to prove the OpenBao trust chain end to end before
  # a real release tag fires. The token never leaves the server process.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ .Values.argo.credentialedServiceAccount | default "oberth-argo-credentialed" | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oberth.fullname" . }}-argo
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oberth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oberth.fullname" . }}-argo

