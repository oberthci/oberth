# Persist the single executor-identity retry across observer/server restarts.
# Pod patch permission is bound only to the trusted server ServiceAccount.
# Separate from the frozen -argo Role to preserve Helm SSA ownership.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oberth.fullname" . }}-argo-identity-retry
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oberth.fullname" . }}-argo-identity-retry
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oberth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oberth.fullname" . }}-argo-identity-retry
