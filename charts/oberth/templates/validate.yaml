{{- $q := .Values.storage.tmp -}}
{{- if not (regexMatch "^([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+|[KMGTPE]i|[kKMGTPE]|m)?$" $q) -}}
{{- fail "storage.tmp is not a Kubernetes quantity" -}}
{{- end -}}
{{- $suffix := regexFind "[a-zA-Z]+$" $q -}}
{{- $number := trimSuffix $suffix $q | float64 -}}
{{- $factors := dict "" 1.0 "m" 0.001 "k" 1000.0 "K" 1000.0 "M" 1000000.0 "G" 1000000000.0 "T" 1000000000000.0 "P" 1000000000000000.0 "E" 1000000000000000000.0 "Ki" 1024.0 "Mi" 1048576.0 "Gi" 1073741824.0 "Ti" 1099511627776.0 "Pi" 1125899906842624.0 "Ei" 1152921504606846976.0 -}}
{{- if lt (ceil (mulf $number (get $factors $suffix))) 1946157056.0 -}}
{{- fail "storage.tmp must be at least 1856Mi" -}}
{{- end -}}
{{- if eq .Values.pipeline.namespace .Release.Namespace -}}
{{- fail "server and pipeline namespaces must differ" -}}
{{- end -}}
{{- if not (hasPrefix "/var/lib/oberth/" (clean .Values.database.file)) -}}
{{- fail "database.file must be absolute and under /var/lib/oberth/" -}}
{{- end -}}
{{- range $name, $value := dict "public.url" .Values.server.public.url "secret_store.address" .Values.secretStore.address -}}
{{- $u := urlParse $value -}}
{{- $host := regexReplaceAll ":[0-9]*$" $u.host "" -}}
{{- if and (hasPrefix "[" $host) (hasSuffix "]" $host) -}}
{{- $host = trimSuffix "]" (trimPrefix "[" $host) -}}
{{- end -}}
{{- if or (ne $u.scheme "https") (empty $host) (ne $u.userinfo "") (ne $u.query "") (ne $u.fragment "") (regexMatch "^https://@" $value) -}}
{{- fail (printf "%s must be HTTPS without credentials, query or fragment" $name) -}}
{{- end -}}
{{- end -}}
