{{- /*
Shared step limits for native Argo synchronization (docs/native-synchronization.md).
A step's `synchronization.semaphores[].configMapKeyRef` names this ConfigMap and
one of its keys; the Argo controller reads the integer and queues the step. The
name is fixed so pipeline YAML can reference it without knowing the release.
*/ -}}
{{- $argoSync := .Values.argoSync | default dict -}}
{{- $semaphores := $argoSync.semaphores | default dict -}}
{{- if $semaphores }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oberth-sync-limits
  namespace: {{ required "argo.namespace is required" .Values.argo.namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
data:
  {{- range $key := keys $semaphores | sortAlpha }}
  {{ $key }}: {{ printf "%d" (int64 (get $semaphores $key)) | quote }}
  {{- end }}
{{- end }}
