{{- range $name, $value := dict "release" 30000 "promotion" 20000 "qualification" 10000 "lint" 0 }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: oberth-run-{{ $name }}-{{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
value: {{ $value }}
globalDefault: false
preemptionPolicy: Never
description: Native pending order for {{ $name }} runs; no preemption or fair-share guarantee.
{{- end }}
