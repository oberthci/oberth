{{- $goProxy := .Values.argo.goProxy | default dict -}}
{{- if $goProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oberth.fullname" . }}-goproxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # This read-only listener remains useful to already-running CI while the
  # server's /readyz fails on scheduler recovery, Kubernetes or audit health.
  # Keep only this Service routable; the API/SSH readiness gate is unchanged.
  publishNotReadyAddresses: true
  selector:
    {{- include "oberth.selectorLabels" . | nindent 4 }}
  ports:
    - name: goproxy
      port: {{ $goProxy.port | default 8444 }}
      targetPort: goproxy
      protocol: TCP
{{- end }}
