{{- if not .Values.tls.existingSecret }}
{{- $name := include "oberth.tlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Clients pin this exact leaf certificate; keep it across uninstall so a
    # reinstall does not silently break every configured MCP client.
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $ca := genCA "oberth-local-ca" 3650 }}
  {{- $dns := list "oberth" (printf "oberth.%s" .Release.Namespace) (printf "oberth.%s.svc" .Release.Namespace) (printf "oberth.%s.svc.cluster.local" .Release.Namespace) }}
  {{- $cert := genSignedCert "oberth" nil $dns 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
