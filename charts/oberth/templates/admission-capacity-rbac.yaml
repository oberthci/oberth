# Read-only capacity sanity check; no node mutation, proxy, or kubelet access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-allocatable
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-allocatable
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oberth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oberth.fullname" . }}-{{ .Release.Namespace }}-allocatable
