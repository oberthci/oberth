{{- if .Values.upstream.createSecrets }}
{{/*
  Upstream identity Secrets — lookup-guarded conditional render.

  SECURITY FIX (key leak + upgrade wipe):

  The original template used lookup to re-emit existing Secret data via
  {{ toYaml $existing.data }}, which leaked private key bytes into the Helm
  release Secret (sh.helm.release.v1.*) in etcd and into dry-run/debug output.

  The subsequent rewrite rendered both Secrets with unconditional data: {} and
  claimed SSA field managers would retain ownership of their data keys during
  Helm upgrades. That claim was WRONG: Helm 3 uses a CLIENT-SIDE three-way
  merge (patch = merge(old release manifest, new manifest, live)), not
  server-side apply. A data key present in the old release manifest but absent
  from the new manifest (data: {}) is DELETED from the live Secret, wiping the
  forge SSH key on the first connected upgrade.

  Correct behavior (this template):

  - Fresh install (Secret does not exist) and offline helm template / dry-run
    (lookup always returns empty): render the Secret with data: {} and
    helm.sh/resource-policy: keep. No key material enters the manifest.

  - Connected upgrade of an existing install (Secret already exists): render
    NOTHING for that Secret. Helm sees the resource removed from the new
    manifest, but because the tracked resource carries helm.sh/resource-policy:
    keep, Helm ORPHANS it — the live Secret and its data are preserved
    untouched, and the key is removed from all future release-manifest history.
    Per-upstream dedicated keys (SSA data keys) are likewise never touched
    because Helm no longer renders the Secret at all for existing installs.

  The server provisions the shared key at first boot (upstream add), and
  per-upstream dedicated keys are applied via server-side-apply under
  per-upstream field managers (upstream add --dedicated-key). Both paths write
  directly to the live Secret, not through Helm values.

  To provision upstream Secrets externally, set upstream.createSecrets=false and
  create the Secrets before install. The chart will not render or adopt them.
*/}}
{{- $existingKey := lookup "v1" "Secret" .Release.Namespace .Values.upstream.keySecret -}}
{{- $existingHosts := lookup "v1" "Secret" .Release.Namespace .Values.upstream.knownHostsSecret -}}
{{- if not $existingKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.upstream.keySecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
type: Opaque
data: {}
{{- end }}
{{- if and (not $existingKey) (not $existingHosts) }}
---
{{- end }}
{{- if not $existingHosts }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.upstream.knownHostsSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
type: Opaque
data: {}
{{- end }}
{{- end }}
