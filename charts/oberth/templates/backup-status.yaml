apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oberth-backup-status
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [oberth-backup]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oberth-backup-status
  namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oberth-backup-status}
subjects:
  - {kind: ServiceAccount, name: oberth, namespace: {{ .Release.Namespace }}}
