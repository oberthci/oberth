{{- $trustedTests := .Values.trustedTests | default dict -}}
{{- if $trustedTests.recipes }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oberth.fullname" . }}-trusted-tests
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
data:
  recipes.json: {{ $trustedTests.recipes | toJson | quote }}
{{- end }}
