apiVersion: v1
kind: Service
metadata:
  name: {{ include "oberth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "oberth.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.service.sshPort }}
      targetPort: ssh
{{- if ne .Values.service.type "ClusterIP" }}
      nodePort: {{ .Values.service.sshNodePort }}
{{- end }}
      protocol: TCP
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
{{- if ne .Values.service.type "ClusterIP" }}
      nodePort: {{ .Values.service.httpsNodePort }}
{{- end }}
      protocol: TCP
