{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Workflow",
  "spec": {
    "entrypoint": "probe",
    "activeDeadlineSeconds": 90,
    "templates": [
      {
        "name": "probe",
        "container": {
          "image": "golang:1.26.10-trixie@sha256:7202554ed358a37f41c44e4910ae29bbc5ef0715f289ac637218adbb0ca132dd",
          "command": [
            "/usr/bin/python3"
          ],
          "args": [
            "-I",
            "-B",
            "-c",
            "import json,time; print(json.dumps({\"format\":\"oberth-ci-acceptance-probe-v1\",\"event\":\"started\"}),flush=True); time.sleep(60); print(json.dumps({\"format\":\"oberth-ci-acceptance-probe-v1\",\"event\":\"finished\"}),flush=True)"
          ],
          "resources": {
            "requests": {
              "cpu": "100m",
              "memory": "64Mi"
            },
            "limits": {
              "cpu": "1",
              "memory": "128Mi"
            }
          }
        }
      }
    ]
  }
}
