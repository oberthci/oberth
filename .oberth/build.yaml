# Main storage budgets are explicit: bounded Argo helpers also cap the aggregate Pod.
# Unsized cold Go/scanner leaves retain the existing 8Gi private scratch envelope;
# utility/PVC writers use 512Mi and artifact staging uses 2Gi, all provisional.
# Reviewed peak floors add 1.3x memory / 1.5x storage headroom; all bounds remain provisional.
# CPU requests follow observed averages up to 1000m; main storage limits are at least 512Mi.
# Sources: branch a5144ee1989c, release 398379142b7c and last-30 maxima; retain larger existing floors.
# Pod storage samples include wait (512Mi limit) and disk /tmp (8Gi emptyDir sizeLimit), not PVCs.
# Neither the helper allowance nor the emptyDir sizeLimit is a measured main-container peak.
# Oberth CI pipeline (branch-trigger) for the oberth repository.
#
# Every step is its own Argo template with its own container, exit code, and
# named log slice, which is the per-step granularity the Oberth execution model
# guarantees. Steps are deliberately not collapsed into shell scripts: a
# collapsed step reports one status for several pieces of work, and per-step
# status, logs and red are the entire point of the model.
#
# TODO(oberth-admission): Oberth sets metadata.name, metadata.namespace,
# and labels (oberth.ci/repo, oberth.ci/trigger, oberth.ci/ref,
# oberth.ci/sha) at submission time. The metadata block carries only the
# annotations the admission layer reads statically.
#
# TODO(oberth-admission): Oberth forces the serviceAccountName via a
# trigger-gated switch (ForceIdentity). Branch pushes bind to a CI-tier
# ServiceAccount with no Vault/OpenBao access and no automounted token.
# The YAML must not declare serviceAccountName.
#
# Oberth injects the source checkout into every container template
# (injectServerVolumes). The mechanism is a read-only mount at /work/src of a
# per-run PersistentVolumeClaim that the server creates in the pipeline
# namespace and fills with this revision before submitting: a Pod may only
# mount claims in its own namespace, so the server's own workspace volume is
# not reachable from here. Templates set workingDir: /work/src and do not
# declare the source mount themselves.
#
# Oberth injects a persistent Go module and build cache into every container
# template (injectServerVolumes -> cacheVolumeAndMount). The mechanism is a
# writable mount at /work/cache of node-local storage under the server's own
# --ci-cache-root, in a directory scoped to this repository, and the
# server also sets GOMODCACHE=/work/cache/gomod and GOCACHE=/work/cache/gobuild.
#
# That injected environment OVERRIDES whatever this document sets for those two
# variables, which is why the GOMODCACHE/GOCACHE values and the /cache/gomod and
# /cache/gobuild mounts below are a fallback rather than the live configuration:
# they are what a server with no cache root configured falls back to, and they
# keep the caches shared between the steps of one run in that case. Do not
# declare a cache volume here -- admission refuses a repository hostPath, and
# the server decides whether a cache exists at all.
#
# Go module/build caches and the versioned lint result cache persist between runs.
# Tool binaries stay on the per-run `work` claim on purpose: `go install` publishes into GOBIN with a truncating
# write, and a warm build cache makes reinstalling them a few seconds anyway.
#
# Tool custody (#567): the setup burn is the only writer of those tools. Every
# later leaf sees private scratch read-only. The Go leaves (vet, lint, test-*,
# build-*) do so through an explicit readOnly request on that mount, which the
# server honours while keeping the persistent Go caches writable (the
# `readonly` annotation would make those read-only too, and `none` would drop
# them for a cold private cache per leaf). The lint wrapper selects the existing
# repository cache, with a Pod-private fallback, outside the read-only tools.
# shellcheck, chart, security (Trivy, Pod-private DB) and release-diagnostic opt out of the
# shared workspace entirely. This pipeline holds no credential; every leaf
# declares automountServiceAccountToken: false.
# internal/argojob/oberth_pipeline_test.go checks the admitted Pods.
#
# After setup, security runs as a required parallel gate alongside lint and
# independent checks. Tests/chart start after setup; every output build still
# requires lint explicitly. Serializing lint ahead of branch tests can exhaust the
# workflow budget. Allow 90 minutes for setup and builds on loaded hosts;
# workflow parallelism still bounds active Pods.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  annotations:
    oberth.ci/nonroot-templates: test-static-git-runtime
spec:
  entrypoint: ci
  # Bound repository-local fan-out to three Pods; native resource trial required.
  parallelism: 3
  # Keep the enlarged race step budgets inside the overall CI deadline.
  activeDeadlineSeconds: 7200

  volumeClaimTemplates:
  - metadata:
      name: work
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

  templates:

  # ---- DAG entrypoint ----
  - name: ci
    dag:
      tasks:
      - name: setup
        template: setup
      - name: generic-names
        template: generic-names
      - name: contract-guard
        template: contract-guard
      - name: lint
        template: lint
        depends: setup
      - name: test-store
        template: test-store
        depends: setup
      - name: test-service
        template: test-service
        depends: setup
      - name: test-rest
        template: test-rest
        depends: setup
      - name: build-static-git-runtime
        template: build-static-git-runtime
        depends: setup
      - name: test-static-git-runtime
        template: test-static-git-runtime
        depends: build-static-git-runtime
      - name: test-gitcache
        template: test-gitcache
        depends: setup
      - name: test-archive-history
        template: test-archive-history
        depends: setup
      - name: test-openbao
        template: test-openbao
        depends: setup
      - name: security
        template: security
        depends: setup
      - name: shellcheck
        template: shellcheck
        depends: setup
      - name: chart
        template: chart
        depends: setup
      - name: chart-unittest
        template: chart-unittest
        depends: setup
      - name: test-chart-schema
        template: test-chart-schema
        depends: setup
      - name: test-make-entrypoints
        template: test-make-entrypoints
        depends: setup
      - name: test-release-prune-contract
        template: test-release-prune-contract
        depends: setup
      - name: release-diagnostic
        template: release-diagnostic
        depends: setup
      - name: verify-publisher-tools
        template: verify-publisher-tools
        depends: setup
      - name: build-amd64
        template: build-amd64
        depends: "lint && test-store && test-service && test-rest && test-gitcache && test-static-git-runtime && test-archive-history && chart && chart-unittest && test-chart-schema && test-make-entrypoints && test-release-prune-contract"
      - name: build-arm64
        template: build-arm64
        depends: "lint && test-store && test-service && test-rest && test-gitcache && test-static-git-runtime && test-archive-history && chart && chart-unittest && test-chart-schema && test-make-entrypoints && test-release-prune-contract"
      - name: build-darwin-amd64
        template: build-darwin-amd64
        depends: "lint && test-store && test-service && test-rest && test-gitcache && test-static-git-runtime && test-archive-history && chart && chart-unittest && test-chart-schema && test-make-entrypoints && test-release-prune-contract"
      - name: build-darwin-arm64
        template: build-darwin-arm64
        depends: "lint && test-store && test-service && test-rest && test-gitcache && test-static-git-runtime && test-archive-history && chart && chart-unittest && test-chart-schema && test-make-entrypoints && test-release-prune-contract"

  # Refuse retired branding in every tracked file, including fixtures and docs,
  # and check the store migration sequence (latest+1, no ID collisions).
  - name: generic-names
    activeDeadlineSeconds: 183 # remeasure: max(60s censored cap, 63s pod span) x1.5, rounded up; floor observed+120s for contention
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    retryStrategy:
      limit: 2
      retryPolicy: OnError
      backoff:
        duration: 30s
        factor: 2
    container:
      image: "golang:1.26.10-trixie@sha256:7202554ed358a37f41c44e4910ae29bbc5ef0715f289ac637218adbb0ca132dd"
      workingDir: /work/src
      command: ["/bin/sh", "-ec"]
      args: ["/usr/bin/python3 -I -B hack/test-new-migration.py; /usr/bin/python3 -I -B .oberth/test_check_migration_sequence.py; git init -q --bare /tmp/migration-base && git --git-dir /tmp/migration-base fetch -q --no-tags --depth=1 https://github.com/oberthci/oberth.git main && /usr/bin/python3 -I -B .oberth/check-migration-sequence.py --base-git-dir /tmp/migration-base --base FETCH_HEAD; /usr/bin/python3 -I -B hack/test-generic-names.py; /usr/bin/python3 -I -B hack/check-generic-names.py; /usr/bin/python3 -I -B hack/test-private-addresses.py; exec /usr/bin/python3 -I -B hack/check-private-addresses.py"]
      # provisional: source run a5144ee1989c; incomplete CPU/storage terminal coverage.
      # Observed CPU avg max 894.1m, memory peak 142.6Mi, pod storage 0.1Mi.
      # Sampled lower bounds: retain requests/limits; apply only the 512Mi storage minimum.
      resources: # remeasure: one-time censored peak x1.5; collect fresh uncensored measurements
        requests:
          cpu: 1000m # measured request 1470m; retain the CI policy cap
          memory: 256Mi
          ephemeral-storage: 512Mi
        limits:
          cpu: 1500m
          memory: 256Mi
          ephemeral-storage: 512Mi # provisional utility bound; remeasure cold volumes

  - name: contract-guard
    activeDeadlineSeconds: 420 # remeasure: observed span unknown; provisional previous 300s cap + 120s for contention
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    retryStrategy:
