  # Build helm, oberth-release-support, oberth-release-image and fetch cosign,
  # matching release.yaml's exact env -i, flags, and Go toolchain.
  - name: vpt-build-and-fetch
    activeDeadlineSeconds: 900 # remeasure: censored 600s pod deadline x1.5; includes startup and wait; floor observed+120s for contention
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    retryStrategy:
      limit: 2
      retryPolicy: OnError
      backoff:
        duration: 30s
        factor: 2
    script:
      image: "golang:1.26.10-trixie@sha256:7202554ed358a37f41c44e4910ae29bbc5ef0715f289ac637218adbb0ca132dd"
      workingDir: /work/src
      command: [/bin/sh]
      source: |
        set -eu
        mkdir -p /tmp/vpt-tools/bin

        # helm (release.yaml install-helm)
        env -i \
          PATH=/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          GOTOOLCHAIN=local GOWORK=off GOENV=off \
          GOPATH=/tmp/vpt-private/gopath \
          GOMODCACHE=/tmp/vpt-private/gomod \
          GOCACHE=/tmp/vpt-private/gobuild \
          GOBIN=/tmp/vpt-tools/bin \
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          GOMAXPROCS=1 GOFLAGS='-p=1' \
          GOPROXY=https://proxy.golang.org \
          GOSUMDB=sum.golang.org \
          /usr/local/go/bin/go install \
          -trimpath -buildvcs=false '-ldflags=-buildid=' \
          helm.sh/helm/v4/cmd/helm@v4.2.3

        # oberth-release-support (release.yaml build-release-support)
        env -i \
          PATH=/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          GOTOOLCHAIN=local GOWORK=off GOENV=off \
          GOPATH=/tmp/vpt-private/gopath \
          GOMODCACHE=/tmp/vpt-private/gomod \
          GOCACHE=/tmp/vpt-private/gobuild \
          GOBIN=/tmp/vpt-tools/bin \
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          GOMAXPROCS=1 GOFLAGS='-p=1 -mod=readonly' \
          GOPROXY=https://proxy.golang.org \
          GOSUMDB=sum.golang.org \
          /usr/local/go/bin/go build \
          -trimpath -buildvcs=false '-ldflags=-buildid=' \
          -o /tmp/vpt-tools/bin/oberth-release-support \
          ./cmd/oberth-release-support

        # oberth-release-image (release.yaml build-release-image)
        env -i \
          PATH=/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          GOTOOLCHAIN=local GOWORK=off GOENV=off \
          GOPATH=/tmp/vpt-private/gopath \
          GOMODCACHE=/tmp/vpt-private/gomod \
          GOCACHE=/tmp/vpt-private/gobuild \
          GOBIN=/tmp/vpt-tools/bin \
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          GOMAXPROCS=1 GOFLAGS='-p=1 -mod=readonly' \
          GOPROXY=https://proxy.golang.org \
          GOSUMDB=sum.golang.org \
          /usr/local/go/bin/go build \
          -trimpath -buildvcs=false '-ldflags=-buildid=' \
          -o /tmp/vpt-tools/bin/oberth-release-image \
          ./cmd/oberth-release-image

        # cosign (release.yaml fetch-cosign: upstream binary)
        /usr/bin/curl --fail --location --no-progress-meter --show-error \
          --connect-timeout 10 --max-time 90 --retry 2 --retry-all-errors \
          --proto =https --proto-redir =https --tlsv1.2 \
          --output /tmp/vpt-tools/bin/cosign \
          https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-amd64
      env:
