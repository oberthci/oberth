apiVersion: argoproj.io/v1alpha1
kind: Workflow
spec:
  entrypoint: build
  activeDeadlineSeconds: 3600
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
  volumeClaimTemplates:
    - metadata: {name: work}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 6Gi}}
  volumes:
    - name: cache
      persistentVolumeClaim: {claimName: build-cache}
  templateDefaults:
    container:
      image: golang@sha256:7202554ed358a37f41c44e4910ae29bbc5ef0715f289ac637218adbb0ca132dd
      workingDir: /work/src
      env:
        - {name: GOMAXPROCS, value: '6'}
        - {name: GOFLAGS, value: '-mod=readonly -buildvcs=false -p=2'}
        - {name: GOCACHE, value: /cache/build}
        - {name: GOMODCACHE, value: /cache/modules}
        - {name: GOTMPDIR, value: /cache/tmp}
        - {name: RELEASE_BASE, value: /work/shared/base-image}
        - {name: RELEASE_DIR, value: /work/shared/dist}
        - {name: RELEASE_SHARED, value: /work/shared}
        - {name: GIT_CONFIG_COUNT, value: '1'}
        - {name: GIT_CONFIG_KEY_0, value: safe.directory}
        - {name: GIT_CONFIG_VALUE_0, value: /work/src}
      volumeMounts:
        - {name: cache, mountPath: /cache}
        - {name: work, mountPath: /work/shared}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
  templates:
    - name: build
      dag:
        tasks:
          # Tests take the shipped Git from the prepared base: if the base pull fails, the push
          # gets no test result. The wait costs no wall time only while the go semaphore is 1.
          - {name: go-tests-pass-with-race, template: go, depends: prepare-base, arguments: {parameters: [{name: target, value: test}]}}
          - {name: prepare-base, template: prepare-base}
          - {name: release-bytes-build, template: go, depends: prepare-base, arguments: {parameters: [{name: target, value: build-bytes}]}}
          - {name: lint-and-guards-pass, template: lint-and-guards-pass, depends: release-bytes-build}
    - name: go
      synchronization:
        semaphores:
          - configMapKeyRef: {name: oberth-sync-limits, key: go}
      inputs:
        parameters: [{name: target}]
        artifacts: &source-artifacts
          - name: source
            path: /work/src
            mode: 0755
            plugin: {name: oberth, key: '{{workflow.parameters.oberth-source}}', configuration: '{"version":1,"kind":"main"}'}
      container:
        resources: {requests: {cpu: '2', memory: 2Gi}, limits: {cpu: '6', memory: 8Gi}}
        command: [bash, -ec]
        args:
          - |
            mkdir -p "$GOTMPDIR"
            candidate=$(git rev-parse HEAD | python3 -c 'import sys; print("v0.0." + str(int(sys.stdin.read().strip()[:15], 16)))')
            if [ "$TARGET" = test ]; then
              bash hack/base-image/check.sh --base "$RELEASE_BASE" --pin .oberth/pins/base-image.digest --git-out "$RELEASE_SHARED/git"
              export OBERTH_TEST_GIT="$RELEASE_SHARED/git/git"
            fi
            make "$TARGET" VERSION="$candidate"
            if [ "$TARGET" = build-bytes ]; then
              cp "$RELEASE_DIR/oberth-linux-$(go env GOARCH)" "$RELEASE_SHARED/oberth"
              chmod 755 "$RELEASE_SHARED/oberth"
            fi
        env:
          - {name: TARGET, value: '{{inputs.parameters.target}}'}
    - name: lint-and-guards-pass
      metadata:
        annotations: {oberth.ci/secret-paths: oberth/policy/names}
      inputs:
        artifacts: *source-artifacts
      synchronization:
        semaphores: [{configMapKeyRef: {name: oberth-sync-limits, key: go}}]
      container:
        command: [/work/shared/oberth, secretstore, exec]
        args: [--, bash, hack/static.sh]
        env: [{name: BUILD_DEFAULT_REF, value: refs/heads/main}]
        resources: {requests: {cpu: '2', memory: 2Gi}, limits: {cpu: '6', memory: 8Gi}}
    - name: prepare-base
      inputs:
        artifacts: *source-artifacts
      synchronization:
        semaphores: [{configMapKeyRef: {name: oberth-sync-limits, key: go}}]
      container:
        command: [bash, hack/prepare-base.sh]
        resources: {requests: {cpu: '1', memory: 256Mi}, limits: {cpu: '2', memory: 2Gi}}
