{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Workflow",
  "sources": [
    {
      "repository": "codeberg/cloudtaser/cloudtaser-pipeline",
      "commit": "904667f7b00ff834af10788a4f8e47523293df11",
      "path": "/work/sources/probe"
    }
  ],
  "spec": {
    "entrypoint": "probe",
    "activeDeadlineSeconds": 60,
    "templates": [
      {
        "name": "probe",
        "container": {
          "image": "golang:1.26.10-trixie@sha256:7202554ed358a37f41c44e4910ae29bbc5ef0715f289ac637218adbb0ca132dd",
          "command": [
            "/usr/bin/python3"
          ],
          "args": [
            "-I",
            "-B",
            "-c",
            "\"\"\"Executed only inside a coordinator-authorized hosted probe Pod.\"\"\"\nimport errno,hashlib,json,os,pathlib,re,sys\nroot=pathlib.Path('/work/sources/probe')\nrelative,digest=sys.argv[1:]\nassert relative and not relative.startswith('/') and all(p not in ('','.', '..') for p in relative.split('/'))\nassert re.fullmatch('[0-9a-f]{64}',digest)\nfile=root/relative\nassert file.is_file() and not file.is_symlink(), 'known producer file missing or symlinked'\nassert hashlib.sha256(file.read_bytes()).hexdigest()==digest,'producer bytes differ'\n# Find the effective mount for the known file, not an unrelated read-only mount.\nmounts=[]\nfor line in pathlib.Path('/proc/self/mountinfo').read_text().splitlines():\n fields=line.split(); target=re.sub(r'\\\\([0-7]{3})',lambda m:chr(int(m[1],8)),fields[4])\n if str(file)==target or str(file).startswith(target.rstrip('/')+'/'):\n  mounts.append((len(target),target,fields[5].split(',')))\nassert mounts and 'ro' in max(mounts)[2], 'source filesystem is not mounted read-only'\ntry:\n fd=os.open(file,os.O_WRONLY|os.O_APPEND)\nexcept OSError as error:\n assert error.errno==errno.EROFS, 'write refusal was not read-only-filesystem'\nelse:\n os.close(fd)\n raise AssertionError('producer file opened for writing')\nassert not (root/'.git').exists(), 'Git metadata delivered'\nassert not pathlib.Path('/var/run/secrets/kubernetes.io/serviceaccount/token').exists(),'main received service-account token'\nassert not any(re.search(r'(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE_KEY)',key,re.I) for key in os.environ),'unexpected credential-shaped environment name'\nprint(json.dumps({'format':'oberth-pinned-source-probe-v1','known_file':relative,'sha256':digest,'readonly_errno':errno.EROFS,'git_metadata_absent':True,'main_token_absent':True,'credential_environment_absent':True},sort_keys=True))\n",
            "README.md",
            "ce2e92ee80216dfdb2a5eff81ad500e23c68e5dd41a0e99a030cf6cb1bf62079"
          ],
          "resources": {
            "requests": {
              "cpu": "100m",
              "memory": "64Mi"
            },
            "limits": {
              "cpu": "1",
              "memory": "128Mi"
            }
          }
        }
      }
    ]
  }
}
