  # ---- test-openbao burn (#803) ----
  # Real OpenBao integration test: starts a dev server, applies rendered
  # per-repo/per-step policies, and asserts ACL isolation with real reads.
  # The setup helper also runs over verified TLS with real Transit keys and denied reads.
  # Reuse the verified Go module/build caches; the pinned OpenBao binary stays private.
  - name: test-openbao
    activeDeadlineSeconds: 791 # preserve release-base deadline; 45s + 600s + 120s + 26s cleanup
    automountServiceAccountToken: false
    retryStrategy:
      limit: 2
      retryPolicy: OnError
      backoff:
        duration: 30s
        factor: 2
    script:
      image: "golang:1.26.10-trixie@sha256:7202554ed358a37f41c44e4910ae29bbc5ef0715f289ac637218adbb0ca132dd"
      workingDir: /work/src
      command: [bash]
      source: |
        set -euo pipefail
        # Bounded phases preserve a full 120-second test window after cold compilation.
        # Fetch and verify the pinned OpenBao binary (45 seconds total).
        printf 'openbao-phase=download\n'
        BAO_VERSION=2.6.1
        BAO_ARCHIVE="openbao_${BAO_VERSION}_linux_amd64.tar.gz"
        BAO_URL="https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/${BAO_ARCHIVE}"
        BAO_DIR="/tmp/openbao"
        export BAO_ARCHIVE BAO_URL BAO_DIR
        # 40s work plus at most 5s TERM-to-KILL = 45s complete phase.
        timeout --signal=TERM --kill-after=5s 40s bash -c '
          set -euo pipefail
          mkdir -p "$BAO_DIR"
          curl --connect-timeout 10 --max-time 40 -fsSL -o "$BAO_DIR/$BAO_ARCHIVE" "$BAO_URL"
          cd "$BAO_DIR"
          sha256sum -c /work/src/.oberth/pins/openbao.sha256
          # Root CI containers lack CAP_CHOWN; do not restore archive ownership.
          tar --no-same-owner -xzf "$BAO_ARCHIVE" bao
          chmod +x bao
        '
        cd /work/src
        # Run the integration tests.
        export BAO_PATH="$BAO_DIR/bao"
        export CGO_ENABLED=1
        export GOTOOLCHAIN=local
        export GOWORK=off
        export GOENV=off
        # Bound compiler concurrency and per-process GC; unit suites retain -race.
        export GOMAXPROCS=2
        export GOMEMLIMIT=256MiB
        printf 'openbao-phase=compile\n'
        # 595s work plus at most 5s TERM-to-KILL = 600s compile phase.
        timeout --signal=TERM --kill-after=5s 595s \
          go test -mod=readonly -p=1 -tags=openbao_integration -c \
          -o "$BAO_DIR/installer.test" ./internal/installer/
        printf 'openbao-phase=test\n'
        cd /work/src/internal/installer
        "$BAO_DIR/installer.test" -test.count=1 -test.v -test.timeout=120s \
          -test.run='^(TestPolicyIsolation.*|TestSetupSecretStoreOpenBao)$'
        printf 'openbao-phase=complete\n'
      env:
      - name: PATH
        value: "/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"
      - name: HOME
        value: "/tmp"
      - name: TMPDIR
        value: "/tmp"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
        readOnly: true
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      # Preserve release-base resource floors while reusing Go caches (#1489).
      # Provisional reviewed floors; sampled peaks remain lower bounds.
      # CPU last-30 max 1314.121m; memory last-30 max 3136.008Mi.
      # Pod storage last-30 max 3419.941Mi.
      # Memory request >= peak, limit >= 1.3x; storage limit >= 1.5x. Remeasure.
      resources: # remeasure: one-time censored peak x1.5; collect fresh uncensored measurements
        requests:
          cpu: 1000m # measured request 1951m; retain the CI policy cap
          memory: 3200Mi
          ephemeral-storage: 8Gi
        limits:
          cpu: 2950m
          memory: 4096Mi
          ephemeral-storage: 8Gi # provisional private-working-set bound; remeasure cold volumes

