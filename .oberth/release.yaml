# Main storage budgets are explicit: bounded Argo helpers also cap the aggregate Pod.
# Unsized cold Go/scanner leaves retain the existing 8Gi private scratch envelope;
# utility/PVC writers use 512Mi and artifact staging uses 2Gi, all provisional.
# Reviewed peak floors add 1.3x memory / 1.5x storage headroom; all bounds remain provisional.
# CPU requests follow observed averages up to 1000m; main storage limits are at least 512Mi.
# Sources: branch a5144ee1989c, release 398379142b7c and last-30 maxima; retain larger existing floors.
# Pod storage samples include wait (512Mi limit) and disk /tmp (8Gi emptyDir sizeLimit), not PVCs.
# Neither the helper allowance nor the emptyDir sizeLimit is a measured main-container peak.
# Release workflow. The Golang and Trivy images pin their Linux amd64
# platform manifests, not multi-platform indexes: bootstrap tools and their
# reviewed digests target amd64 even when the Kubernetes node is arm64.
# Release Pod execution of both pinned manifests was verified on arm64 kind.
# Every Pod leaf uses the template-level token and workspace
# controls every server since v0.16.6 honours (#567): it declares
# oberth.ci/workspace-mounts: none and oberth.ci/workspace-env: none, and every
# leaf except the six credentialed ones (release-sign-binaries, release-publish-images,
# release-publish-homebrew, release-publish-chart,
# release-verify, release-public-artifacts) declares
# automountServiceAccountToken: false. The release-public-artifacts leaves already
# required v0.16.6, so the bootstrap leaves' former v0.16.5 admission
# compatibility bought nothing. internal/argojob/oberth_pipeline_test.go
# (TestOberthPipelinesIsolateSharedWorkspace) checks the admitted Pods.
#
# Do not rename a claim to `work`: the old server gives that reserved claim
# implicit tools/cache/output mounts in every leaf. Tests instead receive their
# own copied tools. Neither test Pods nor downloaded-artifact execution Pods
# receive the trusted publisher-tools claim. Lint, scanning and chart tests retain
# their dependency gates; race tests use the same four package groups as CI.
#
# With workspace-mounts none the server injects neither the persistent
# /work/cache hostPath nor /work/artifacts (older servers did); every executed
# command still replaces its environment and uses pod-private caches. Credentialed
# shells use only system PATH and absolute hash-verified publisher tools.
# Init checks source bytes against the admitted commit and all executable pins
# before secretstore can run. Tool hashes come from two clean independent builds.
#
# Token isolation: secretstore leaves get the explicit release token; tests,
# builders and public runtime verification declare automount false and do not.
# Older servers additionally relied on the release ServiceAccount setting
# automountServiceAccountToken: false.
# This dependency is checked against actual controller and SA-admission output.
# Argo's wait container mirrors writable mounts; no claim-wide read-only
# guarantee is inferred from the main container's readOnly flag.
#
# The public runtime gate verifies signed bytes before/after execution and
# writes a source-and-byte-bound receipt. Finalization holds a repo-scoped
# mutex, consumes the receipt read-only, and never executes release artifacts.
#
# All secrets retain exact store field names beneath OBERTH_SECRETSTORE_DIR.
# Verification uses image-reader WIF and the committed public signing key.
# Public artifact upload and finalization use a closed release-public-artifacts
# template. Its init container verifies publisher tools before credentials are
# fetched. Source and runtime receipts remain read-only across the boundary.
# Node inputs are staged only for dashboard JavaScript tests.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  annotations:
    oberth.ci/secret-paths: oberth/data/release/cosign-secret,oberth/data/release/homebrew-tap-key,oberth/data/release/cloudflare-oberth-workers-token
spec:
  entrypoint: release
  # Bound repository-local fan-out to three Pods; native resource trial required.
  parallelism: 3
  activeDeadlineSeconds: 14400
  volumeClaimTemplates:
  - metadata:
      name: bootstrap-tools
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi
  - metadata:
      name: bootstrap-test-tools
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          # Ten isolated tool copies replace seven; retain per-copy headroom.
          storage: 6Gi
  - metadata:
      name: bootstrap-output
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: bootstrap-runtime-receipts
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: bootstrap-node-inputs
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  templates:
  - name: release
    dag:
      tasks:
      - name: release-setup
        template: release-setup
      - name: release-lint
        template: release-lint
        depends: release-setup && release-scan
      - name: release-scan
        template: release-scan
        depends: release-setup
      - name: release-test
        template: release-test
        depends: release-lint && release-scan
      - name: release-chart-test
        template: release-chart-test
        depends: release-setup && release-scan
      - name: release-build
        template: release-build
        depends: release-test && release-chart-test && release-verify-publisher-tools
      - name: release-verify-publisher-tools
        template: verify-publisher-tools
        depends: release-setup && release-scan
      - name: release-sign-binaries
        template: release-sign-binaries
        depends: release-package-chart
      - name: release-publish-images
        template: release-publish-images
        depends: release-build

      - name: release-publish-homebrew
        template: release-publish-homebrew
        depends: release-publish-public
      - name: release-package-chart
        template: release-package-chart
        depends: release-publish-images
      - name: release-publish-chart
        template: release-publish-chart
        depends: release-sign-binaries && release-package-chart
      - name: release-publish-public
        template: release-public-artifacts
        arguments:
          parameters:
          - name: phase
            value: publish-public
        depends: release-publish-chart
      - name: release-verify
        template: release-verify
        depends: release-publish-public && (release-publish-homebrew.Succeeded
          || release-publish-homebrew.Failed || release-publish-homebrew.Errored)
      - name: release-runtime
        template: release-runtime
        depends: release-verify
      - name: release-finalize
        template: release-public-artifacts
        arguments:
          parameters:
          - name: phase
            value: finalize
        depends: release-runtime
