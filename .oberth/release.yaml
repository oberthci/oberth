# Release workflow. The Golang and Trivy images pin their Linux amd64
# platform manifests, not multi-platform indexes: bootstrap tools and their
# reviewed digests target amd64 even when the Kubernetes node is arm64.
# Release Pod execution of both pinned manifests was verified on arm64 kind.
# Every Pod leaf uses the template-level token and workspace
# controls every server since v0.16.6 honours (#567): it declares
# oberth.ci/workspace-mounts: none and oberth.ci/workspace-env: none, and every
# leaf except the six credentialed ones (release-sign-binaries, release-publish-images,
# release-publish-homebrew, release-publish-chart, release-verify, release-website) declares
# automountServiceAccountToken: false. The release-website leaves already
# required v0.16.6, so the bootstrap leaves' former v0.16.5 admission
# compatibility bought nothing. internal/argojob/oberth_pipeline_test.go
# (TestOberthPipelinesIsolateSharedWorkspace) checks the admitted Pods.
#
# Do not rename a claim to `work`: the old server gives that reserved claim
# implicit tools/cache/output mounts in every leaf. Tests instead receive their
# own copied tools. Neither test Pods nor downloaded-artifact execution Pods
# receive the trusted publisher-tools claim. The five original test commands
# and their dependency gates are preserved.
#
# With workspace-mounts none the server injects neither the persistent
# /work/cache hostPath nor /work/artifacts (older servers did); every executed
# command still replaces its environment and uses pod-private caches. Credentialed
# shells use only system PATH and absolute hash-verified publisher tools.
# Init checks source bytes against the admitted commit and all executable pins
# before secretstore can run. Tool hashes come from two clean independent builds.
#
# Token isolation: secretstore leaves get the explicit release token; tests,
# builders and public runtime verification declare automount false and do not.
# Older servers additionally relied on the release ServiceAccount setting
# automountServiceAccountToken: false.
# This dependency is checked against actual controller and SA-admission output.
# Argo's wait container mirrors writable mounts; no claim-wide read-only
# guarantee is inferred from the main container's readOnly flag.
#
# The public runtime gate verifies signed bytes before/after execution and
# writes a source-and-byte-bound receipt. Finalization holds a repo-scoped
# mutex, consumes the receipt read-only, and never executes release artifacts.
#
# All secrets retain exact store field names beneath OBERTH_SECRETSTORE_DIR.
# Verification fetches only gar-reader-key; it uses the committed public key.
# Cloudflare upload, finalization and website deployment reuse one closed
# release-website template. Candidate inputs and runtime receipts mount read-only;
# public phases snapshot signed inputs into Pod-private scratch and never execute
# candidate artifacts. The signers have no Cloudflare capability.
#
# Website publication (#649). The credential-free setup steps fetch-node,
# verify-node and stage-website-packages stage only hash-checked inputs (the
# pinned Node tarball and a content-addressed npm cache) in their own
# bootstrap-website-inputs claim; npm runs there with lifecycle scripts off,
# so no package code executes. The release-website leaf's init containers
# re-verify the admitted source and those inputs, copy them into Pod-private
# scratch and install wrangler offline against the committed lockfile's
# sha512 integrity; only then does its main container fetch its single
# credential (cloudflare-oberth-workers-token) and deploy the oberth.ci
# Worker. The tokenless release-website-readback leaf proves the public URLs
# serve the admitted bytes. Website templates declare
# automountServiceAccountToken: false unless they are the credentialed leaf,
# and none of them receives shared workspace mounts or environment.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  annotations:
    oberth.ci/size: L
    oberth.ci/secret-paths: oberth/data/release/gar-image-key,oberth/data/release/gar-chart-key,oberth/data/release/gar-reader-key,oberth/data/release/cosign-secret,oberth/data/release/homebrew-tap-key,oberth/data/release/cloudflare-oberth-workers-token
spec:
  entrypoint: release
  activeDeadlineSeconds: 14400
  volumeClaimTemplates:
  - metadata:
      name: bootstrap-tools
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi
  - metadata:
      name: bootstrap-test-tools
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 4Gi
  - metadata:
      name: bootstrap-output
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: bootstrap-runtime-receipts
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - metadata:
      name: bootstrap-website-inputs
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  templates:
  - name: release
    dag:
      tasks:
      - name: release-setup
        template: release-setup
      - name: release-lint
        template: release-lint
        depends: release-setup
      - name: release-scan
        template: release-scan
        depends: release-setup
      - name: release-test
        template: release-test
        depends: release-lint && release-scan
      - name: release-chart-test
        template: release-chart-test
        depends: release-setup
      - name: release-build
        template: release-build
        depends: release-test && release-chart-test && release-verify-publisher-tools
      - name: release-verify-publisher-tools
        template: verify-publisher-tools
        depends: release-setup
      - name: release-sign-binaries
        template: release-sign-binaries
        depends: release-build
      - name: release-publish-images
        template: release-publish-images
        depends: release-build
      - name: release-publish-homebrew
        template: release-publish-homebrew
        depends: release-publish-public
      - name: release-package-chart
        template: release-package-chart
        depends: release-publish-images
      - name: release-publish-chart
        template: release-publish-chart
        depends: release-sign-binaries && release-package-chart
      - name: release-publish-public
        template: release-website
        arguments:
          parameters:
          - name: phase
            value: publish-public
        depends: release-publish-chart
      - name: release-verify
        template: release-verify
        depends: release-publish-public && (release-publish-homebrew.Succeeded || release-publish-homebrew.Failed
          || release-publish-homebrew.Errored)
      - name: release-runtime
        template: release-runtime
        depends: release-verify
      - name: release-finalize
        template: release-website
        arguments:
          parameters:
          - name: phase
            value: finalize
        depends: release-runtime
      - name: release-website
        template: release-website
        arguments:
          parameters:
          - name: phase
            value: publish-website
        depends: release-finalize
      - name: release-website-readback
        template: release-website-readback
        depends: release-website
  - name: release-setup
    steps:
    - - name: tools-dir
        template: tools-dir
    - - name: copy-trivy
        template: copy-trivy
    - - name: link-go
        template: link-go
    - - name: install-golangci-lint
        template: install-golangci-lint
    - - name: install-helm
        template: install-helm
    - - name: fetch-cosign
        template: fetch-cosign
    - - name: verify-cosign
        template: verify-cosign
    - - name: install-cosign
        template: install-cosign
    - - name: build-release-support
        template: build-release-support
    - - name: build-release-image
        template: build-release-image
    - - name: validate-tag
        template: validate-tag
    - - name: fetch-node
        template: fetch-node
    - - name: verify-node
        template: verify-node
    - - name: stage-website-packages
        template: stage-website-packages
    - - name: copy-test-tools
        template: copy-test-tools
  - name: tools-dir
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"
      - bootstrap-clean
      - /bin/mkdir
      - -p
      - /tmp/oberth-tools/bin
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: verify-publisher-tools
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          "$@"
      - publisher-verifier
      - /usr/bin/python3
      - -I
      - -S
      - -B
      - /work/src/.oberth/verify-release-tools.py
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: true
      resources:
        requests:
          cpu: '1'
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 256Mi
  - name: copy-trivy
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: aquasec/trivy:0.73.0@sha256:4bbf3824d974b70f27631005e2e6194d4d8fbd6e72c4a9e04cf521e25c5cb07f
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"
      - bootstrap-clean
      - /bin/cp
      - /usr/local/bin/trivy
      - /tmp/oberth-tools/bin/trivy
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '1'
          memory: 512Mi
        limits:
          cpu: '1'
          memory: 512Mi
  - name: link-go
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"
      - bootstrap-clean
      - /bin/ln
      - -sf
      - /usr/local/go/bin/go
      - /usr/local/go/bin/gofmt
      - /tmp/oberth-tools/bin
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: install-golangci-lint
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        for attempt in 1 2 3 4 5; do
          if /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            exit 1
          fi
          sleep "$((attempt * 3))"
        done
      - bootstrap-clean
      - /usr/local/go/bin/go
      - install
      - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: install-helm
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        for attempt in 1 2 3 4 5; do
          if /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          GOMAXPROCS=1 \
          GOFLAGS='-p=1' \
          GOPROXY=https://proxy.golang.org \
          GOSUMDB=sum.golang.org "$@"; then
            exit 0
          fi
          if [ "$attempt" -eq 5 ]; then
            exit 1
          fi
          sleep "$((attempt * 3))"
        done
      - bootstrap-clean
      - /usr/local/go/bin/go
      - install
      - -trimpath
      - -buildvcs=false
      - -ldflags=-buildid=
      - helm.sh/helm/v4/cmd/helm@v4.2.3
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: fetch-cosign
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"
      - bootstrap-clean
      - /usr/bin/curl
      - --fail
      - --location
      - --no-progress-meter
      - --show-error
      - --connect-timeout
      - '10'
      - --max-time
      - '90'
      - --retry
      - '2'
      - --retry-all-errors
      - --proto
      - =https
      - --proto-redir
      - =https
      - --tlsv1.2
      - --output
      - /tmp/oberth-tools/bin/cosign
      - https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-amd64
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: verify-cosign
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"
      - bootstrap-clean
      - /usr/bin/sha256sum
      - -c
      - .oberth/pins/cosign.sha256
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: true
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: install-cosign
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -eu
        exec /usr/bin/env -i PATH=/tmp/oberth-tools/bin:/usr/local/go/bin:/usr/bin:/bin \
          HOME=/tmp \
          OBERTH_TOOLS_DIR=/tmp/oberth-tools \
          GOTOOLCHAIN=local \
          GOWORK=off \
          GOENV=off \
          GOPATH=/tmp/bootstrap-private/gopath \
          GOMODCACHE=/tmp/bootstrap-private/gomod \
          GOCACHE=/tmp/bootstrap-private/gobuild \
          GOLANGCI_LINT_CACHE=/tmp/bootstrap-private/lint \
          TRIVY_CACHE_DIR=/tmp/oberth-trivy \
          GIT_TERMINAL_PROMPT=0 \
          KUBEBUILDER_ASSETS= \
          OBERTH_RELEASE_SHA="$OBERTH_RELEASE_SHA" \
          OBERTH_RELEASE_TAG="$OBERTH_RELEASE_TAG" \
          GOBIN=/tmp/oberth-tools/bin \
          CGO_ENABLED=1 "$@"
      - bootstrap-clean
      - /bin/chmod
      - '0755'
      - /tmp/oberth-tools/bin/cosign
      env:
      - name: PATH
        value: /usr/bin:/bin
      volumeMounts:
      - name: bootstrap-tools
        mountPath: /tmp/oberth-tools
        readOnly: false
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: build-release-support
    automountServiceAccountToken: false
    metadata:
      annotations:
        oberth.ci/workspace-mounts: none
        oberth.ci/workspace-env: none
    container:
      image: golang:1.26.6-trixie@sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0
      workingDir: /work/src
      command:
      - /bin/sh
      - -c
      args:
      - |
