# The objects .oberth/build.yaml and .oberth/release.yaml read, and nothing else.
# Replace every REPLACE_WITH_* value, then apply this file in the pipeline namespace.
# Creating an object grants no access: run the grant and secret lines the refusals
# print, listed in docs/releasing.md. Store the private names policy as admin:
# oberth secret put --repo '<repo>' --file .oberth/build.yaml --step lint-and-guards-pass \
#   oberth/policy/names < <private-names-file>
# The policy is a delivered secret file, never a plain object in this manifest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-cache
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_WITH_CACHE_STORAGE_CLASS
  resources:
    requests: {storage: REPLACE_WITH_CACHE_SIZE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: release-cache
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_WITH_CACHE_STORAGE_CLASS
  resources:
    requests: {storage: REPLACE_WITH_CACHE_SIZE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oberth-sync-limits
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
data:
  go: REPLACE_WITH_GO_PARALLELISM
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-config
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
data:
  origin: REPLACE_WITH_HTTPS_RELEASE_ORIGIN
