# The objects .oberth/build.yaml and .oberth/release.yaml read, and nothing else.
# Replace every REPLACE_WITH_* value, then apply this file in the pipeline namespace.
# Creating an object grants no access: run the grant and secret lines the refusals
# print, listed in docs/releasing.md. Store the private names policy and the
# repository identity (one "Name <email>" line) as admin:
# oberth secret put --repo '<repo>' --file .oberth/build.yaml --step lint-and-guards-pass \
#   oberth/policy/names < <private-names-file>
# oberth secret put --repo '<repo>' --file .oberth/build.yaml --step lint-and-guards-pass \
#   oberth/policy/identity < <identity-file>
# Both are delivered secret files, never plain objects in this manifest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-cache
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_WITH_CACHE_STORAGE_CLASS
  resources:
    requests: {storage: REPLACE_WITH_CACHE_SIZE}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: release-cache
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_WITH_CACHE_STORAGE_CLASS
  resources:
    requests: {storage: REPLACE_WITH_CACHE_SIZE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-config
  namespace: REPLACE_WITH_PIPELINE_NAMESPACE
data:
  origin: REPLACE_WITH_HTTPS_RELEASE_ORIGIN
  registry-provider: REPLACE_WITH_WORKLOAD_IDENTITY_PROVIDER_RESOURCE
  registry-account: REPLACE_WITH_REGISTRY_WRITER_ACCOUNT_EMAIL
