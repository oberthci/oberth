              devices:
                disks:
                  - name: root
                    disk:
                      bus: virtio
                  - name: init
                    disk:
                      bus: virtio
                interfaces:
                  - name: default
                    masquerade: {}
            networks:
              - name: default
                pod: {}
            volumes:
              - name: root
                containerDisk:
                  image: quay.io/example/disk@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              - name: init
                cloudInitNoCloud:
                  userData: |
                    #cloud-config
                    runcmd:
                      - echo ready
    - name: delete-k
      resource:
        action: delete
        setOwnerReference: true
        manifest: |
          apiVersion: kubevirt.io/v1
          kind: VirtualMachineInstance
          metadata:
            name: "{{workflow.name}}-k"
            labels:
              oberth.ci/workflow: "{{workflow.name}}"
    - name: cleanup
      steps:
      - - name: cleanup-a
          template: delete-a
        - name: cleanup-b
          template: delete-b
        - name: cleanup-c
          template: delete-c
        - name: cleanup-k
          template: delete-k
